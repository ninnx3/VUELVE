<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#744a69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vuelve">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Vuelve · Tu diario de nutrición</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#372333; --muted:#7d6c7a; --soft:#94738b; --accent:#a17998;
  --plum:#744a69; --plum-d:#5e3a55;
  --pink:#f4e1e8; --lilac:#eae3f3; --lilac-b:#dfd2e5; --beige:#f4ece0; --mint:#e3efe9;
  --tile:#f4f0f7; --seg:#ede7ee;
  --line:#e9e1e8; --bg:#fbf8fb; --green:#547969;
  --gold:#d4ac52; --base:#7aa898; --ex:#a99bd0; --food:#e2a08c;
  --p:#c45c72; --c:#7b5ea7; --g:#d4a72c; --warn:#c0504d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--plum)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px calc(150px + env(safe-area-inset-bottom))}
html,body{overscroll-behavior-y:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
nav.tabs{transform:translateZ(0)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.animos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.animos button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--ink,#3a2436)}
.animos button span{font-size:30px;line-height:1}
.animos button.on{background:var(--abg);border-color:var(--afg);color:var(--afg)}
.apill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}.apill.sm{padding:3px 9px;font-size:11.5px}
#balcard .ar{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
.cprow{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--tile);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.cprow small{display:block;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft)}.cprow code{font-size:12px;word-break:break-all;color:var(--ink)}
.psteps{margin:10px 0 0 18px;line-height:1.6;font-size:14px}.psteps li{margin-top:8px}.psteps code{background:var(--tile);padding:1px 5px;border-radius:6px;font-size:12px}
.pstate{margin-top:12px;background:#eef6f1;border:1.5px solid #cfe5d8;color:#2f5f48;border-radius:14px;padding:10px 14px;font-weight:600;font-size:13px}
.langsw{display:inline-flex;background:var(--tile);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}.langsw button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted)}.langsw button.on{background:var(--plum);color:#fff}
.blist{margin-top:10px}.bday{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.bday.fut{opacity:.4}
.bday .bd{width:38px;text-align:center;flex-shrink:0}.bday .bd b{display:block;font-size:12px}.bday .bd small{color:var(--muted);font-size:11px}.bday .bc{flex:1;min-width:0}

.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}
.celebra{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(1);z-index:201;background:#fff;border-radius:24px;padding:22px 26px;min-width:240px;max-width:86vw;text-align:center;box-shadow:0 24px 60px rgba(64,40,60,.25);animation:celin .45s cubic-bezier(.2,1.4,.4,1);cursor:pointer}
.celebra .em{font-size:46px;line-height:1}.celebra b{display:block;font-size:19px;font-weight:800;margin-top:8px;color:var(--ink,#3a2436)}.celebra small{display:block;margin-top:6px;color:var(--muted);font-size:13px;line-height:1.4}
.celebra.out{opacity:0;transform:translate(-50%,-50%) scale(.9);transition:.3s}
@keyframes celin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.btn.cerrar{margin-top:8px;background:rgb(110,207,151);color:#14432b;border:0}
.btn.cerrar:hover{background:rgb(96,196,139)}
.btn.cerrar.done{background:#e3f6eb;color:#1f6a43}
.pwwrap{position:relative;display:block}.pwwrap .in{padding-right:48px;width:100%}
.pwwrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:10px;background:none}
.pwwrap .eye:active{background:var(--tile)}
.obinv{margin-top:12px;border:1.5px solid var(--pink,#f3cfdc);background:#fff7fa}
.obinv.on{border-color:var(--green);background:#f2fbf6}
.silu{position:relative;margin-top:8px}
.silu svg{position:absolute;left:0;top:0}
.silu .mrow{position:absolute;left:0;right:0;height:36px;display:flex;align-items:center;justify-content:flex-end;pointer-events:none}
.silu .mrow i{position:absolute;right:172px;top:50%;border-top:1.5px dashed var(--plum);opacity:.55}
.silu .mrow i::before{content:'';position:absolute;left:-4px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--plum)}
.silu .mrow label{pointer-events:auto;width:166px;display:flex;align-items:center;gap:6px;background:var(--bg,#fdfafc);border-radius:12px}
.silu .mrow label span{width:64px;font-size:10.5px;font-weight:700;color:var(--plum);text-transform:uppercase;letter-spacing:.8px;text-align:right}
.silu .mi{flex:1}
.silu .mi{position:relative}.silu .mi .in{padding:8px 34px 8px 10px;margin:0;height:auto}.silu .mi small{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:12px}
.medgrid .stat small{display:block}
@media(max-width:640px){.medgrid{grid-template-columns:1fr 1fr}}
.sheet.wide{max-width:720px}
.ingrow{display:grid;grid-template-columns:1fr 70px 78px 1fr 40px;gap:6px;margin-top:6px;align-items:center}
.ingrow .in{padding:10px 8px;font-size:16px}
@media(max-width:640px){.ingrow{grid-template-columns:1fr 64px 74px 40px}.ingrow [data-if=sec]{display:none}.grid4{grid-template-columns:1fr 1fr}}
.eyebrow{font-size:9px;font-weight:800;color:var(--soft);letter-spacing:1.5px;text-transform:uppercase}
.h1{font-size:40px;font-weight:800;letter-spacing:-2.2px;line-height:1.05}
.h1 span,.h2 span{font-weight:500;color:var(--accent)}
.h2{font-size:28px;font-weight:800;letter-spacing:-1.2px;line-height:1.1}
.h3{font-size:16px;font-weight:700}
@media(max-width:560px){.h1{font-size:34px;letter-spacing:-1.6px}.h2{font-size:24px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;background:var(--plum);color:#fff;font-weight:700;font-size:14px;transition:background .15s,transform .1s}
.btn:hover{background:var(--plum-d)}
.btn:active{transform:scale(.99)}
.btn.soft{background:var(--lilac);color:var(--plum);border:1px solid var(--lilac-b)}
.btn.soft:hover{background:#e2d8ef}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:11px;padding:10px 16px}
.btn.ghost:hover{background:var(--tile)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.danger{background:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Inputs */
label.f{display:block;margin-top:14px}
label.f>span{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:14px;font-weight:500;transition:border .15s}
.in:focus{border-color:var(--accent)}
.in::placeholder{color:#b4a7b1}
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].in::-webkit-calendar-picker-indicator{opacity:.6}
.grid2>*,.grid3>*{min-width:0}
.err{color:var(--warn);font-size:12px;margin-top:10px;min-height:16px}

/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:14px}
.tile{background:var(--tile);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.tile .lbl{font-size:12px;font-weight:700}
.tile .big{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:auto;line-height:1}
.tile .big small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}

/* Header */
a.logo{color:inherit;text-decoration:none;cursor:pointer}
header.app{position:sticky;top:0;padding-top:env(safe-area-inset-top);background:#fff;border-bottom:1px solid var(--line);z-index:20}
header.app .in2{max-width:1000px;margin:0 auto;padding:0 20px;height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:40px;height:40px;border-radius:10px;background:linear-gradient(140deg,#9b6b8d,#5e3a55);display:grid;place-items:center;color:#fff;font-weight:600;font-style:italic;font-size:12px;letter-spacing:-.3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.logo b{display:none}
.logo .wm{height:34px;width:auto;color:var(--plum);flex-shrink:0;display:block}
@media(max-width:400px){.logo .wm{height:28px}.logo>div{padding-left:9px}}
.logo>div{border-left:1px solid var(--line);padding-left:12px;margin-left:2px}
.logo small{display:block;font-size:9px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-top:2px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--lilac);color:var(--plum);display:grid;place-items:center;font-weight:800;font-size:15px;position:relative;box-shadow:0 0 0 3px #f3eef7}
.avatar i{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:8px;display:grid;place-items:center;font-style:normal;color:var(--muted)}
#sync{font-size:10px;font-weight:600;color:var(--muted);margin-right:12px;white-space:nowrap}
#sync.cloud{color:var(--green)}#sync.error{color:var(--warn)}
@media(max-width:560px){#sync{display:none}}

/* Bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,254,254,.96);backdrop-filter:blur(8px);box-shadow:0 -4px 25px rgba(64,40,60,.05);z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in2{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
nav.tabs button{padding:7px 4px;border-radius:12px;font-size:11px;color:var(--plum);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{background:var(--lilac)}
nav.tabs button:not(.on){color:var(--muted)}

/* Hero */
.hero{padding-top:34px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .eyebrow{margin-bottom:8px}
.strip{display:flex;justify-content:space-between;align-items:center;background:var(--lilac);border-radius:12px;padding:12px 16px;margin-top:22px;font-size:13px;color:var(--muted);font-weight:500}
.strip small{font-size:10px}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px;margin-top:20px}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--plum);color:#fff;box-shadow:0 3px 8px rgba(116,74,105,.16)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.datenav .ar{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.datenav .ar:hover{background:var(--tile)}
.datenav .t{text-align:center}
.datenav .t b{display:block;font-size:18px;font-weight:700;letter-spacing:-.4px}
.datenav .t small{font-size:10px;color:var(--muted)}

/* Summary */
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--lilac);color:var(--plum);display:grid;place-items:center;font-size:12px;font-weight:700}
.sum{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center;margin-top:14px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ctr b{font-size:34px;font-weight:700;letter-spacing:-1.3px;line-height:1;display:block}
.ring .ctr small{font-size:10px;color:var(--muted)}
.mac3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mac3>div{background:var(--tile);border-radius:12px;padding:12px 6px 10px}
.mac3 b{font-size:21px;font-weight:800;letter-spacing:-.8px}
.mac3 b small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.mac3 .l{font-size:12px;color:var(--muted)}
.mac3 .mb{height:4px;border-radius:4px;background:var(--line);margin:8px auto 0;max-width:110px;overflow:hidden}
.mac3 .mb i{display:block;height:100%;border-radius:4px}
@media(max-width:560px){.sum{grid-template-columns:1fr;justify-items:center}.mac3{width:100%}.mac3 b{font-size:17px}}
.daytype{display:flex;gap:6px;margin-top:16px;background:var(--seg);padding:4px;border-radius:12px}
.daytype button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:12px;color:var(--muted)}
.daytype button.on{background:#fff;color:var(--plum);box-shadow:0 2px 6px rgba(116,74,105,.1)}

/* Energy */
.energy{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:#fbfcfb}
.ebar{position:relative;height:24px;border-radius:999px;background:var(--line);margin-top:36px;overflow:visible}
.ebar .eclip{position:absolute;inset:0;border-radius:999px;overflow:hidden}
.ebar .seg1{position:absolute;left:0;top:0;bottom:0;background:var(--base)}
.ebar .seg2{position:absolute;top:0;bottom:0;background:var(--ex)}
.ebar .fd{position:absolute;left:0;bottom:0;height:12px;border-radius:0 999px 999px 0;background:var(--food)}
.ebar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--plum)}
.ebar .mk span{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--lilac);color:var(--plum);font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.deficit{display:flex;justify-content:space-between;align-items:center;background:var(--mint);border-radius:10px;padding:12px 12px;margin-top:14px}
.deficit b{font-size:20px;font-weight:800;letter-spacing:-.6px}
details.how{margin-top:16px}
details.how summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
details.how summary::before{content:'▸ ';font-size:10px}
details.how[open] summary::before{content:'▾ '}
.foot{text-align:center;font-size:10px;color:var(--soft);margin:22px 0}

/* Meals */
.meal{padding:14px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:4px}
.meal .h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;gap:10px}
.item .n{flex:1;min-width:0}
.item.editable{cursor:pointer;border-radius:10px}.item.editable:active{background:var(--tile)}
.item .n small{display:block;color:var(--muted);font-size:11px}
.item .k{font-weight:700;white-space:nowrap}
.x{color:var(--muted);width:26px;height:26px;border-radius:8px;flex-shrink:0}
.x:hover{background:var(--pink);color:var(--warn)}
.plus{width:32px;height:32px;border-radius:50%;background:var(--lilac);color:var(--plum);font-size:18px;font-weight:600;flex-shrink:0}
.plus:hover{background:#e0d4ee}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(55,35,51,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fdfafc;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px;padding:20px;animation:pop .2s;box-shadow:0 20px 50px rgba(55,35,51,.18)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.sheet .top b{font-size:16px;font-weight:700}
.close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--muted)}
.back{font-size:10px;color:var(--muted);margin-top:8px;font-weight:600}
.back:hover{color:var(--plum)}
.mealpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mealpick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.mealpick button span{font-size:18px}
.mealpick button.on{background:var(--lilac);border-color:var(--accent);color:var(--plum)}
.ways{display:grid;gap:10px;margin-top:16px}
.way{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px}
.way:hover{border-color:var(--accent);background:#fff}
.way .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.way b{display:block;font-size:14px}
.way small{color:var(--muted);font-size:12px}
.subseg{display:flex;background:var(--seg);border-radius:10px;padding:3px;margin-top:12px}
.subseg button{flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:600;color:var(--muted)}
.subseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.searchrow{display:flex;gap:8px;margin-top:10px}
.results{margin-top:14px;max-height:48vh;overflow:auto;padding-right:4px}
.rcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rcard:hover{border-color:var(--lilac-b)}
.rcard b{font-size:13px;font-weight:700;display:block}
.rcard .k{font-size:12px;color:var(--ink)}
.rcard small{display:block;font-size:10px;color:var(--muted)}
.star{font-size:16px;color:#d9cfd7;width:28px;height:28px}
.star.on{color:var(--gold)}
.notfound{font-size:11px;color:var(--muted);margin-top:12px;font-weight:500}
.notfound a{color:var(--plum);font-weight:600;text-decoration:none}
.pv{background:var(--tile);border-radius:12px;padding:14px;margin-top:12px}

/* Countdown */
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px auto 0;max-width:560px}
.cd div{border-radius:18px;padding:18px 6px 14px;text-align:center}
.cd b{font-size:clamp(34px,9vw,58px);font-weight:800;display:block;line-height:1;letter-spacing:-1.5px}
.cd small{display:block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:1.6px;color:#7d6c7a}
.cd.sm{gap:8px;margin-top:10px}.cd.sm div{border-radius:12px;padding:12px 4px 10px}.cd.sm b{font-size:30px;letter-spacing:-1px}.cd.sm small{font-size:8.5px;margin-top:4px;letter-spacing:1px}
.cd div:nth-child(1){background:#f4dce3;color:#8a4f6e}
.cd div:nth-child(2){background:#e9dcf2;color:#7b5ea7}
.cd div:nth-child(3){background:#f4e6d4;color:#a88445}
.cd div:nth-child(4){background:#dcece6;color:#5f9480}
.cdcard{text-align:center;margin-top:28px;padding:30px 8px 8px;border-top:1px solid var(--line)}
.cdcard .h2{margin-top:10px;font-size:clamp(24px,5vw,32px)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.fth{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--tile)}.fth img{width:100%;height:100%;object-fit:cover;display:block}
.fth .fb{position:absolute;left:6px;bottom:6px;font-size:13px;background:rgba(255,255,255,.85);border-radius:8px;padding:1px 5px}
.fth .fx{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);font-size:12px;display:grid;place-items:center}
.fgrid.vu .fth{aspect-ratio:1}.fgrid.off{opacity:.35;filter:grayscale(.6)}
.promopics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.promopics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.welcome .l.foto{background:#f1e6ee}.welcome .l.foto img{width:100%;height:100%;object-fit:cover;display:block}
.welcome .wclose{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}

/* Lists, tables */
table.calc{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.calc td{padding:9px 0;border-bottom:1px solid var(--line)}
table.calc td:last-child{text-align:right;font-weight:700}
.addedbar{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--mint);border:1px solid #cfe3d8;border-radius:14px;padding:10px 12px;margin:10px 0 6px}.addedbar b{color:var(--base,#2f6f5d);font-size:13px}.addedbar small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--lilac);color:var(--plum)}
.pill.ok{background:var(--mint);color:var(--green)}
.pill.warn{background:var(--pink);color:#8a4f6e}
.wk{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.wk:last-child{border-bottom:0}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{font-size:24px;font-weight:800;letter-spacing:-1px;display:block}
.stat small{font-size:9px;color:var(--soft);text-transform:uppercase;letter-spacing:1.2px;font-weight:800}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.plan{border-radius:16px;padding:18px;background:var(--tile);margin-top:12px}
.plan .kc{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1}
.plan .kc small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.plan .mm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.plan .mm div{background:#fff;border-radius:12px;padding:12px 8px;text-align:center}
.plan .mm b{font-size:20px;font-weight:800;display:block;letter-spacing:-.6px}
.plan .mm small{font-size:10px;color:var(--muted);display:block;line-height:1.35}

/* Week/month */
.dayrow{display:grid;grid-template-columns:90px 1fr 92px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.dayrow:last-child{border-bottom:0}
.dayrow:hover b{color:var(--plum)}
.minibar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.minibar i{display:block;height:100%;border-radius:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .hd{text-align:center;font-size:9px;font-weight:800;color:var(--soft);letter-spacing:1px}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;position:relative}
.cal .c.out{background:transparent;color:#cdbfc9;cursor:default}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--plum)}
.cal .c.ok{background:var(--mint);color:var(--green)}
.cal .c.reg{background:var(--pink);color:#8a4f6e}
.cal .c .g{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ex)}

/* Auth & onboarding */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .art{background:linear-gradient(160deg,var(--pink),var(--lilac) 60%,#e3d7ee);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:40px}
.auth .art .bubble{position:absolute;border-radius:50%;opacity:.55}
.auth .art blockquote{position:relative;font-size:30px;font-weight:800;letter-spacing:-1.3px;line-height:1.12;color:var(--plum-d);max-width:380px}
.auth .art blockquote span{font-weight:500;color:var(--accent)}
.auth .box{display:flex;flex-direction:column;justify-content:center;padding:40px;max-width:480px;width:100%;margin:0 auto}
@media(max-width:800px){.auth{grid-template-columns:1fr}.auth .art{display:none}}
.note{margin-top:18px;font-size:11px;color:var(--muted);background:var(--tile);padding:12px 14px;border-radius:12px;line-height:1.5}
.ob{max-width:600px;margin:0 auto;padding:0 20px calc(160px + env(safe-area-inset-bottom))}
.ob-top{position:sticky;top:0;background:var(--bg);padding:calc(18px + env(safe-area-inset-top)) 0 12px;z-index:5}
.pbar{height:5px;background:var(--seg);border-radius:9px;overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;background:var(--plum);border-radius:9px;transition:width .3s}
.ob .lead{color:var(--muted);margin-top:10px;font-size:14px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;gap:12px;align-items:center;transition:.15s}
.opt:hover{border-color:var(--lilac-b)}
.opt.on{border-color:var(--plum);background:var(--lilac)}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.opt.on .ic{background:#fff}
.opt b{display:block;font-size:14px}
.opt small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.ob-nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:28px 20px calc(20px + env(safe-area-inset-bottom))}
.ob-nav .in2{max-width:600px;margin:0 auto;display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:99;animation:pop .2s}
textarea.in{min-height:90px;resize:vertical;font-size:11px;font-family:ui-monospace,monospace}
.welcome{display:grid;grid-template-columns:1fr 1.1fr;max-width:840px;padding:0;overflow:hidden}
.welcome .l{background:linear-gradient(160deg,var(--pink),var(--lilac));min-height:320px;overflow:hidden}.welcome .l svg{display:block}
.welcome .r{padding:28px 24px;position:relative}
@media(max-width:600px){.welcome{grid-template-columns:1fr}.welcome .l{min-height:200px;height:200px}.welcome .l.foto{height:46vh;min-height:260px}.welcome .l.foto img{object-position:center 22%}}

/* Avatar dropdown */
.dd-wrap{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 10px);width:290px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(55,35,51,.14);padding:8px;z-index:40;animation:pop .15s}
.dd .me{display:flex;gap:10px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dd .me b{display:block;font-size:13px}
.dd .me small{font-size:11px;color:var(--muted)}
.dd button.it{display:flex;width:100%;align-items:center;gap:12px;padding:10px;border-radius:10px;text-align:left;font-size:13px;font-weight:600}
.dd button.it:hover{background:var(--tile)}
.dd button.it .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.dd button.it small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.dd hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#d9667f;border:2px solid #fff}

/* Retos */
.emails{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emails span{background:var(--lilac);color:var(--plum);border-radius:999px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.emails span button{width:20px;height:20px;border-radius:50%;font-size:11px}
.emails span button:hover{background:#fff}
.lb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb .pos{width:28px;font-weight:800;font-size:16px;color:var(--soft);text-align:center}
.lb .av{width:36px;height:36px;border-radius:50%;background:var(--lilac);color:var(--plum);display:grid;place-items:center;font-weight:800}
.lb .bar{height:6px;border-radius:6px;background:var(--line);margin-top:5px;overflow:hidden}
.lb .bar i{display:block;height:100%;background:var(--plum);border-radius:6px}
.lb .pts{font-weight:800;font-size:18px;letter-spacing:-.5px}
.mailbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;white-space:pre-wrap;line-height:1.55;margin-top:10px;max-height:200px;overflow:auto}
.optc{display:grid;gap:8px;margin-top:8px}
.optc.two{grid-template-columns:1fr 1fr}
.optc.three{grid-template-columns:repeat(3,1fr)}

/* Mealprep */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.tag.on{background:var(--plum);border-color:var(--plum);color:#fff}
.tag.no.on{background:#c0504d;border-color:#c0504d}
.mealtog{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.mealtog button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:12px}
.mealtog button span{font-size:26px}
.mealtog button{position:relative}
.mealtog button.on{border:2px solid var(--plum);background:var(--lilac);color:var(--plum)}
.mealtog button.on::after{content:'✓';position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--plum);color:#fff;font-size:13px;display:grid;place-items:center}
.mealtog button:not(.on){opacity:.75}
@media(max-width:480px){.mealtog{grid-template-columns:1fr 1fr}}
.gen{text-align:center;padding:40px 10px}
.gen .spin{font-size:46px;display:inline-block;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.week{overflow-x:auto;margin:14px -20px 0;padding:0 20px 8px}
.wgrid{display:grid;grid-template-columns:86px repeat(7,minmax(118px,1fr));gap:8px;min-width:960px}
.wgrid .dh{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.wgrid .dh b{display:block;font-size:13px}
.wgrid .dh small{font-size:10px;font-weight:600}
.wgrid .dh.today{border-color:var(--plum);box-shadow:inset 0 0 0 1px var(--plum)}
.wgrid .rh{display:flex;flex-direction:column;justify-content:center;font-size:11px;font-weight:800;color:var(--soft);letter-spacing:.6px;text-transform:uppercase;gap:2px}
.wgrid .rh span{font-size:20px}
.dish{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s;text-align:left;min-height:118px;position:relative}
.dish:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(55,35,51,.08);border-color:var(--lilac-b)}
.dish .ph{width:100%;aspect-ratio:16/10;border-radius:11px;display:grid;place-items:center;font-size:30px}
.dish b{font-size:11.5px;line-height:1.25;font-weight:700}
.dish small{font-size:10px;color:var(--muted);font-weight:600}
.dish.cheat{border-color:#e8c3a0;background:#fffaf3}
.dish .badge{position:absolute;top:6px;right:6px;background:#fff;border-radius:999px;font-size:9px;font-weight:800;padding:2px 7px;color:#a86a2d;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dish.empty{background:transparent;border-style:dashed;cursor:default;align-items:center;justify-content:center;color:#cdbfc9}
.dish.empty:hover{transform:none;box-shadow:none}
.ph0{background:linear-gradient(140deg,#fbe9ef,#efe6f8)}.ph1{background:linear-gradient(140deg,#f6efe2,#fbe7dc)}.ph2{background:linear-gradient(140deg,#e5f1ea,#eef6e3)}.ph3{background:linear-gradient(140deg,#ece6f6,#e3ecf6)}.ph4{background:linear-gradient(140deg,#fdf0d9,#fbe2e2)}
.recipe .hero-ph{height:200px;border-radius:16px;display:grid;place-items:center;font-size:96px;margin-top:12px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips2 span{background:var(--tile);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:700}
.recipe ol,.recipe ul{padding-left:20px;margin-top:8px}
.recipe li{margin:6px 0;font-size:13px}
.recipe ul.ing{list-style:none;padding:0}
.recipe ul.ing li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:7px 0;margin:0}
.recipe ul.ing li span{color:var(--muted);font-weight:600}
/* Mealprep móvil */
.mpdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:16px}
.mpdays button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px}
.mpdays button small{font-size:9px;font-weight:600}
.mpdays button.on{background:var(--plum);border-color:var(--plum);color:#fff}
.mpdays button.on small{color:#fff!important}
.mplist .dish{flex-direction:row;align-items:center;min-height:0;padding:10px;gap:12px;margin-top:10px;width:100%}
.mplist .dish .ph{width:72px;height:72px;aspect-ratio:auto;flex-shrink:0;font-size:34px}
.mplist .dish b{font-size:14px}
.mplist .dish small{font-size:12px}
.mplist .dish .badge{top:8px;right:8px}
.mplist .slot{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--soft);text-transform:uppercase}
.nav-s{display:none}

/* ======== Móvil ======== */
@media(max-width:640px){
  .in,select.in,textarea.in{font-size:16px}
  .wrap{padding:0 16px calc(140px + env(safe-area-inset-bottom))}
  header.app .in2{height:64px;padding:0 16px}
  nav.tabs{padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs .in2{gap:2px}
  nav.tabs button{font-size:10.5px;padding:7px 2px;white-space:nowrap}
  .nav-l{display:none}.nav-s{display:inline}
  .hero{padding-top:24px}
  .card{padding:18px;border-radius:18px}
  .modal{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:22px 22px 0 0;max-height:92vh;max-height:calc(100dvh - 24px);padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s}
  .sheet.welcome{border-radius:22px 22px 0 0}
  .dd{position:fixed;left:12px;right:12px;top:70px;width:auto}
  .movwk{flex-direction:column;align-items:flex-start!important;gap:12px}
  .datenav .t b{font-size:16px}
  .mealpick button{font-size:10px}
  .toast{bottom:88px;max-width:90vw;text-align:center}
}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.tip{background:var(--mint);border-radius:12px;padding:12px 14px;font-size:12px;margin-top:14px;color:#3d5d50}

/* ===== Escritorio: menú lateral y contenido más ancho ===== */
@media(min-width:1100px){
  header.app .in2{max-width:none;padding:0 32px}
  nav.tabs{top:72px;bottom:0;right:auto;width:232px;padding:28px 16px;box-shadow:none;border-right:1px solid var(--line);background:#fff;backdrop-filter:none;display:block}
  nav.tabs .in2{max-width:none;display:flex;flex-direction:column;gap:6px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:14px;font-size:14px;font-weight:600;padding:13px 16px;border-radius:14px;white-space:nowrap}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button:not(.on):hover{background:var(--tile)}
  .nav-l{display:inline}.nav-s{display:none}
  main.wrap{max-width:1180px;margin-left:max(272px,calc((100vw - 1180px)/2 + 116px));margin-right:auto;padding:0 40px 70px}
  .daycard .dl .sum{margin-top:6px}
  #view.v-progreso,#view.v-plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px;align-items:start}
  #view.v-progreso>*,#view.v-plan>*{grid-column:1/-1}
  #view.v-progreso>.card,#view.v-plan>.card{grid-column:auto;margin-top:16px}
  #view.v-progreso>#balcard{grid-column:1/-1}
  #view.v-movimiento{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px;align-items:start}
  #view.v-movimiento>*{grid-column:1/-1}
  .modal .sheet{max-width:600px}
  .modal .sheet.welcome{max-width:900px;width:900px}
  .welcome .l{min-height:460px}
  .welcome .r{padding:40px 36px 34px}
}
@media(min-width:1300px){.dcols{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:32px;align-items:start}.dcol.dr>.grid2:first-child{margin-top:0!important}}
@media(min-width:1500px){main.wrap{max-width:1280px;margin-left:max(272px,calc((100vw - 1280px)/2 + 116px))}}

/* ===== Más contraste y títulos más claros ===== */
:root{--base:#2f6f5d;--ink:#3d383c;--muted:#5d4a59;--soft:#8a5a7c;--line:#e2d4de;--bg:#f5eff4;--tile:#f1e8f1;--lilac:#ebe1f3}
body{font-size:15px;color:var(--ink)}
.small{font-size:13px}.tiny{font-size:11px}
.eyebrow{font-size:11px;letter-spacing:2.6px;color:#8a5a7c;font-weight:800}
.h1{font-size:36px;letter-spacing:-1.5px;color:var(--ink)}.h1 span,.h2 span{color:#a07194;font-weight:500}
.h2{color:var(--ink)}.h3{font-size:17px;font-weight:800;color:var(--ink)}
.card{border:1.5px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 2px 16px rgba(60,30,55,.05)}
.card>p.eyebrow:first-child,.card>.row.between>p.eyebrow:first-child,#balcard>p.eyebrow:first-child{font-size:22px;letter-spacing:-.5px;text-transform:none;color:var(--ink);font-weight:800;line-height:1.2}
.tile,.stat{border:1.5px solid var(--line)}
.stat b{color:var(--ink)}
.strip{color:var(--ink);font-weight:600;border:1.5px solid #ddd0ea}
.lead,.muted{color:var(--muted)}
nav.tabs button:not(.on){color:#6c5a69}
nav.tabs button.on{color:var(--plum);font-weight:700}
.btn.soft{border:1.5px solid #ddd0ea}
.card>.row.between .btn{white-space:nowrap;flex-shrink:0}

<script>
/* =========================================================
   VUELVE · Prototipo
   Guardado: nube (cuenta de Claude del visitante) cuando está
   disponible; si no, este navegador (localStorage).
   ========================================================= */

/* ---------- Modo servidor (Supabase) ----------
   Rellena estas dos claves con los datos de tu proyecto (Project Settings → API).
   La "anon public key" es pública y puede ir en la web. NUNCA pongas aquí la service_role. */
const SUPABASE_URL='https://vzzkzajzzehhxzwonpgv.supabase.co';
const SUPABASE_KEY='sb_publishable_9-Tb4XFSfV_EXN6cG1Nxtw_KZotYkWS';
const IN_CLAUDE=!!(window.claude&&window.claude.use)||/claude\.ai|claudeusercontent/.test(location.hostname);
const SERVER=!!(SUPABASE_URL&&SUPABASE_KEY)&&!IN_CLAUDE&&location.protocol!=='file:';
let SB=null,SBUID=null;const RES={};

/* ---------- Almacenamiento local ---------- */
const KEY=SERVER?'vuelve_srv_v1':'vuelve_proto_v1';
let MEM=null;
function load(){
  if(MEM) return MEM;
  try{MEM=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}
  if(!MEM) MEM={users:{},session:null};
  return MEM;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(MEM))}catch(e){}}
function save(){saveLocal();cloudQueue()}
function me(){const d=load();return d.session?d.users[d.session]:null}

/* ---------- Guardado en la nube ---------- */
const CLOUD={db:null,uid:null,state:'local',last:{},timer:null,busy:false,again:false};
const SYNC_TXT={local:'● Guardado en este navegador',saving:'● Guardando…',cloud:'● Guardado en la nube',error:'● Error al guardar en la nube'};
function setSync(s){CLOUD.state=s;const e=document.getElementById('sync');if(e){e.textContent=SYNC_TXT[s];e.className=s}
  const a=document.getElementById('authsync');if(a)a.textContent=authNote()}
function authNote(){return SERVER?'Tu cuenta funciona en cualquier móvil u ordenador.':CLOUD.db?'Se guardan en la nube, ligadas a tu sesión de Claude.':'Se guardan en este navegador.'}
const ekey=e=>e.replace(/[^a-zA-Z0-9_\-.~:@+]/g,'_');
function toDocs(){
  const d=load(),docs={},accounts={session:d.session,users:{},retos:SERVER?{}:(d.retos||{})};
  for(const [em,u] of Object.entries(d.users)){
    const {logs,mealprep,...rest}=u;accounts.users[em]=rest;
    if(mealprep)docs['mp~'+ekey(em)]={email:em,json:JSON.stringify(mealprep)};
    const byM={};
    for(const [date,l] of Object.entries(logs||{})){
      if(!(l.foods||[]).length&&!(l.mov||[]).length&&!l.tipo&&!l.pasos&&!l.animo&&!l.nota)continue;
      (byM[date.slice(0,7)]=byM[date.slice(0,7)]||{})[date]=l;
    }
    for(const [m,days] of Object.entries(byM))docs['log~'+ekey(em)+'~'+m]={email:em,month:m,json:JSON.stringify(days)};
  }
  docs.accounts={json:JSON.stringify(accounts)};
  return docs;
}
function cloudQueue(){
  if(!CLOUD.db)return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(()=>{CLOUD.timer=null;flush()},600);
}
async function flush(){
  if(!CLOUD.db)return;
  if(CLOUD.busy){CLOUD.again=true;return}
  CLOUD.busy=true;
  try{
    const docs=toDocs(),col=SERVER?null:CLOUD.db.collection('data/users/'+CLOUD.uid);
    const put=async(id,body)=>{if(SERVER){const {error}=await SB.from('user_docs').upsert({user_id:SBUID,id,body,updated_at:new Date().toISOString()});if(error)throw error}else await col.doc(id).set(body)};
    const del=async id=>{if(SERVER){const {error}=await SB.from('user_docs').delete().eq('user_id',SBUID).eq('id',id);if(error)throw error}else await col.doc(id).delete()};
    let wrote=false;
    // Si otro dispositivo (o una importación) cambió los datos en el servidor, se juntan antes de escribir
    if(SERVER){const u=me();let merged=false;
      for(const id of Object.keys(docs)){const s=JSON.stringify(docs[id]);if(CLOUD.last[id]===s)continue;
        if(!(id==='accounts'||id.startsWith('log~')))continue;
        const {data:row}=await SB.from('user_docs').select('body').eq('user_id',SBUID).eq('id',id).maybeSingle();
        const lastJ=CLOUD.last[id]?JSON.parse(CLOUD.last[id]).json:null;
        if(!row||row.body?.json===lastJ)continue;
        try{const srv=JSON.parse(row.body.json);
          if(id.startsWith('log~')){for(const [day,l] of Object.entries(srv)){const loc=u.logs[day];
            if(!loc){u.logs[day]=l;merged=true;continue}
            // Lo que este dispositivo tiene vacío se completa con lo del servidor (nunca se pisa algo apuntado en otro dispositivo)
            for(const k of ['foods','mov'])if(!(loc[k]||[]).length&&(l[k]||[]).length){loc[k]=l[k];merged=true}
            for(const k of ['tipo','pasos','animo','nota','cerrado'])if(loc[k]==null&&l[k]!=null){loc[k]=l[k];merged=true}}}
          else{const su=Object.values(srv.users||{})[0]||{};
            for(const w of su.weights||[])if(!u.weights.some(x=>x.date===w.date)){u.weights.push(w);merged=true}
            u.weights.sort((a,b)=>a.date.localeCompare(b.date));
            for(const md of su.medidas||[])if(!(u.medidas||[]).some(x=>x.date===md.date)){(u.medidas=u.medidas||[]).push(md);merged=true}}
        }catch(e){}
        CLOUD.last[id]=JSON.stringify(row.body)}
      if(merged){saveLocal();Object.assign(docs,toDocs());if(!SCREEN.busy&&$('#view'))setTimeout(renderApp,0)}}
    for(const [id,body] of Object.entries(docs)){
      const s=JSON.stringify(body);if(CLOUD.last[id]===s)continue;
      if(!wrote){setSync('saving');wrote=true}
      await put(id,body);CLOUD.last[id]=s;
    }
    for(const id of Object.keys(CLOUD.last))if(!docs[id]){await del(id);delete CLOUD.last[id]}
    if(SERVER)await sbPushResumen();
    setSync('cloud');
  }catch(e){console.warn('Vuelve cloud',e);setSync('error')}
  CLOUD.busy=false;
  if(CLOUD.again){CLOUD.again=false;flush()}
}
async function initCloud(){
  if(SERVER)return;
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use))return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const col=db.collection('data/users/'+uid);
    const snap=await Promise.race([col.get(),new Promise((_,ko)=>setTimeout(()=>ko(new Error('timeout')),10000))]);
    CLOUD.db=db;CLOUD.uid=uid;
    const loc=load();
    if(snap.empty){setSync('cloud');if(Object.keys(loc.users).length)flush();return}
    const remote={users:{},session:null,retos:{}};const logs=[],mps=[];
    snap.docs.forEach(d=>{const b=d.data();CLOUD.last[d.id]=JSON.stringify(b);
      if(d.id==='accounts'){const a=JSON.parse(b.json);remote.session=a.session;remote.retos=a.retos||{};for(const [em,u] of Object.entries(a.users))remote.users[em]={...u,logs:{}}}
      else if(d.id.startsWith('log~'))logs.push(b);
      else if(d.id.startsWith('mp~'))mps.push(b)});
    logs.forEach(b=>{const u=remote.users[b.email];if(u)Object.assign(u.logs,JSON.parse(b.json))});
    mps.forEach(b=>{const u=remote.users[b.email];if(u)u.mealprep=JSON.parse(b.json)});
    for(const [em,u] of Object.entries(loc.users))if(!remote.users[em])remote.users[em]=u;
    for(const [id,r] of Object.entries(loc.retos||{}))if(!remote.retos[id])remote.retos[id]=r;
    if(loc.session&&remote.users[loc.session])remote.session=loc.session;
    MEM=remote;saveLocal();setSync('cloud');flush();
    if(!SCREEN.busy)route();
  }catch(e){console.warn('Vuelve cloud init',e);setSync('local')}
}

/* =========================================================
   SERVIDOR · cuentas, guardado y retos con Supabase
   ========================================================= */
function loadSBLib(){return new Promise((ok,ko)=>{if(window.supabase)return ok();const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar Supabase'));document.head.appendChild(s)})}
function sbErr(e){const m=(e&&e.message)||String(e);
  if(/Invalid login credentials/i.test(m))return 'Email o contraseña incorrectos.';
  if(/already registered|already exists/i.test(m))return 'Ya existe una cuenta con ese email. Inicia sesión.';
  if(/Email not confirmed/i.test(m))return 'Confirma tu email: te hemos enviado un enlace. Revisa también el spam.';
  if(/Password should be at least/i.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/not authorized|email_address_not_authorized/i.test(m))return 'Ahora mismo no podemos enviar el email de confirmación a esa dirección. Avisa a la administradora de Vuelve.';
  if(/email rate limit/i.test(m))return 'Se han enviado demasiados emails en la última hora. Prueba de nuevo más tarde.';
  if(/rate limit|too many/i.test(m))return 'Demasiados intentos seguidos. Espera un minuto y vuelve a intentarlo.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sin conexión con el servidor. Revisa tu internet.';
  return m}
async function initServer(){
  await loadSBLib();
  // "Recordarme": con la casilla marcada la sesión se guarda en el dispositivo; sin marcar, solo mientras la pestaña está abierta.
  const remember=()=>{try{return localStorage.getItem('vuelve_recordar')!=='0'}catch(e){return true}};
  const authStore={getItem:k=>{try{return localStorage.getItem(k)??sessionStorage.getItem(k)}catch(e){return null}},
    setItem:(k,v)=>{try{if(remember()){localStorage.setItem(k,v);sessionStorage.removeItem(k)}else{sessionStorage.setItem(k,v);localStorage.removeItem(k)}}catch(e){}},
    removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}};
  SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'vuelve_auth',storage:authStore}});
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(openNewPassword,300)});
  const {data:{session}}=await SB.auth.getSession();
  if(session){try{await sbLoadUser(session.user)}catch(e){console.warn(e);toast(sbErr(e))}}
  else{MEM={users:{},session:null,retos:{}};saveLocal()}
}
async function sbLoadUser(user){
  SBUID=user.id;const email=(user.email||'').toLowerCase();
  const {data,error}=await SB.from('user_docs').select('id,body');if(error)throw error;
  CLOUD.last={};let u=null,mp=null;const logs={};
  for(const row of data){CLOUD.last[row.id]=JSON.stringify(row.body);
    if(row.id==='accounts'){try{u=Object.values(JSON.parse(row.body.json).users)[0]||null}catch(e){}}
    else if(row.id.startsWith('log~'))Object.assign(logs,JSON.parse(row.body.json));
    else if(row.id.startsWith('mp~'))mp=JSON.parse(row.body.json)}
  if(u){u.logs=logs;if(mp)u.mealprep=mp}
  else{ // Primera vez en el servidor: si este navegador tiene una cuenta de prueba con el mismo email, se trae sus datos.
    let old=null;try{old=JSON.parse(localStorage.getItem('vuelve_proto_v1'))?.users?.[email]||null}catch(e){}
    u=old?JSON.parse(JSON.stringify(old)):{email,nombre:user.user_metadata?.nombre||email.split('@')[0],creada:today(),profile:null,logs:{},weights:[],favs:[],custom:[],off:[]};
    if(old)setTimeout(()=>toast('Hemos traído tus datos de prueba a tu cuenta ✓'),800)}
  delete u.pass;u.email=email;u.logs=u.logs||{};u.weights=u.weights||[];u.favs=u.favs||[];u.custom=u.custom||[];
  MEM={users:{[email]:u},session:email,retos:{}};saveLocal();
  CLOUD.db='sb';CLOUD.res={};setSync('cloud');
  setTimeout(()=>pasosAutoSync().catch(()=>{}),400);
  await sbLoadRetos();flush();
}
async function sbPushResumen(){
  const u=me();if(!u||!u.profile)return;CLOUD.res=CLOUD.res||{};const rows=[];
  for(const d of Object.keys(u.logs)){const c=dayStatus(u,d)==='ok',m=!!(u.logs[d].mov||[]).length,k=(c?1:0)+(m?2:0);
    if(CLOUD.res[d]!==k)rows.push({user_id:SBUID,fecha:d,cumplido:c,movimiento:m})}
  if(!rows.length)return;
  const {error}=await SB.from('dia_resumen').upsert(rows);if(error)throw error;
  rows.forEach(r=>CLOUD.res[r.fecha]=(r.cumplido?1:0)+(r.movimiento?2:0));
}
async function sbLoadRetos(){
  if(!SERVER||!SB)return;
  const {data:rs,error}=await SB.from('retos').select('*,reto_miembros(*)');
  if(error){console.warn('retos',error);return}
  const d=load();d.retos={};const uids=new Set();let minIni=null;
  for(const r of rs||[]){const ms=r.reto_miembros||[];
    d.retos[r.id]={id:r.id,nombre:r.nombre,tipo:r.tipo,inicio:r.inicio,dias:r.dias,owner:r.owner_email,
      miembros:ms.filter(x=>x.estado==='miembro').map(x=>x.email),
      invitados:ms.filter(x=>x.email!==r.owner_email).map(x=>x.email),
      rechazados:ms.filter(x=>x.estado==='rechazado').map(x=>x.email),
      nombres:Object.fromEntries(ms.filter(x=>x.nombre).map(x=>[x.email,x.nombre])),
      uids:Object.fromEntries(ms.filter(x=>x.user_id).map(x=>[x.email,x.user_id]))};
    ms.forEach(x=>{if(x.user_id&&x.user_id!==SBUID&&x.estado==='miembro')uids.add(x.user_id)});
    if(!minIni||r.inicio<minIni)minIni=r.inicio}
  for(const k in RES)delete RES[k];
  if(uids.size){const {data:res}=await SB.from('dia_resumen').select('user_id,fecha,cumplido,movimiento').in('user_id',[...uids]).gte('fecha',minIni);
    (res||[]).forEach(x=>{(RES[x.user_id]=RES[x.user_id]||{})[x.fecha]={c:x.cumplido,m:x.movimiento}})}
  saveLocal();
}
async function sbRun(fn,ok){
  try{const r=await fn();if(r&&r.error)throw r.error;await sbLoadRetos();if(ok)toast(ok);renderApp();return true}
  catch(e){console.warn(e);toast(sbErr(e));return false}
}
const RETOS_API={
  async crear(r,u){
    const {data,error}=await SB.from('retos').insert({owner_email:u.email,nombre:r.nombre,tipo:r.tipo,inicio:r.inicio,dias:r.dias}).select().single();
    if(error)throw error;
    const rows=[{reto_id:data.id,email:u.email,user_id:SBUID,nombre:u.nombre,estado:'miembro'},...r.invitados.map(e=>({reto_id:data.id,email:e,estado:'invitado'}))];
    const {error:e2}=await SB.from('reto_miembros').insert(rows);if(e2)throw e2;
    r.id=data.id;await sbLoadRetos();return r},
  aceptar:(id,u)=>sbRun(()=>SB.from('reto_miembros').update({estado:'miembro',user_id:SBUID,nombre:u.nombre}).eq('reto_id',id).eq('email',u.email),'¡Te has unido al reto! 💜'),
  rechazar:(id,u)=>sbRun(()=>SB.from('reto_miembros').update({estado:'rechazado'}).eq('reto_id',id).eq('email',u.email)),
  salir:(id,u)=>sbRun(()=>SB.from('reto_miembros').delete().eq('reto_id',id).eq('email',u.email),'Has salido del reto'),
  editar:(r,quitar,nuevos=[])=>sbRun(async()=>{const {error}=await SB.from('retos').update({nombre:r.nombre,tipo:r.tipo,inicio:r.inicio,dias:r.dias}).eq('id',r.id);if(error)throw error;
    if(quitar.length){const {error:e2}=await SB.from('reto_miembros').delete().eq('reto_id',r.id).in('email',quitar);if(e2)throw e2}
    for(const email of nuevos){const {error:e3}=await SB.from('reto_miembros').insert({reto_id:r.id,email,estado:'invitado'});
      if(e3&&e3.code==='23505'){const {error:e4}=await SB.from('reto_miembros').update({estado:'invitado'}).eq('reto_id',r.id).eq('email',email);if(e4)throw e4}else if(e3)throw e3}},'Reto actualizado ✓'),
  borrar:id=>sbRun(()=>SB.from('retos').delete().eq('id',id),'Reto eliminado'),
  invitar:(id,email)=>sbRun(async()=>{const {error}=await SB.from('reto_miembros').insert({reto_id:id,email,estado:'invitado'});
    if(error&&error.code==='23505'){const {error:e2}=await SB.from('reto_miembros').update({estado:'invitado'}).eq('reto_id',id).eq('email',email);if(e2)throw e2}
    else if(error)throw error},null)
};
async function logout(){
  const d=load();UI.view='diario';UI.date=today();UI.range='dia';MP.screen='home';LIB.admin=false;LIB.adminChecked=false;LIB.recetas=null;
  if(CLOUD.db){clearTimeout(CLOUD.timer);try{await flush();for(let i=0;i<20&&CLOUD.busy;i++)await new Promise(r=>setTimeout(r,100))}catch(e){}}
  if(SERVER&&SB){await SB.auth.signOut().catch(()=>{});MEM={users:{},session:null,retos:{}};CLOUD.db=null;CLOUD.last={};saveLocal()}
  else{d.session=null;save()}
  route();
}
function openNewPassword(){
  const m=modal(`<div class="top"><b>Nueva contraseña</b><button class="close">✕</button></div>
    <label class="f"><span>Escribe tu nueva contraseña</span><input class="in" type="password" id="np" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label>
    <div class="err" id="ne"></div><button class="btn block" id="ns">Guardar contraseña</button>`);
  m.querySelector('#ns').onclick=async()=>{const p=m.querySelector('#np').value;if(p.length<6){m.querySelector('#ne').textContent='Mínimo 6 caracteres.';return}
    const {error}=await SB.auth.updateUser({password:p});if(error){m.querySelector('#ne').textContent=sbErr(error);return}
    m.remove();toast('Contraseña cambiada ✓')};
}

async function hash(s){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vuelve:'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'f'+h}
}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').trim().replace(',','.'));return isNaN(n)?'':n};
const dec=v=>v===''||v==null?'':String(v).replace('.',',');
const $$=s=>[...document.querySelectorAll(s)];
const R=Math.round;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const DOW=['D','L','M','X','J','V','S'];
const DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON=MONL.map(m=>m.slice(0,3));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=n=>new Intl.NumberFormat('es-ES').format(R(n));
const fmt1=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:1}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
/* ---------- Celebraciones (confeti) ---------- */
const CONF_COL=['#744a69','#c45c72','#7b5ea7','#d4a72c','#6ecf97','#f3b5c8','#a99bd0'];
function confetti(n=140){
  if(n<=0)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';const dpr=Math.min(devicePixelRatio||1,2);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);const x=c.getContext('2d');x.scale(dpr,dpr);
  const P=[...Array(n)].map((_,i)=>{const side=i%2?1:-1,a=(-Math.PI/2)+side*(0.25+Math.random()*0.55);const sp=9+Math.random()*9;
    return {x:innerWidth/2+side*innerWidth*0.28,y:innerHeight*0.62,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:CONF_COL[i%CONF_COL.length],shape:Math.random()<.25?'c':'r'}});
  let t0=performance.now();
  const step=t=>{const dt=Math.min((t-t0)/16.7,2.5);t0=t;x.clearRect(0,0,innerWidth,innerHeight);let alive=0;
    for(const p of P){p.vy+=0.32*dt;p.vx*=Math.pow(0.985,dt);p.vy*=Math.pow(0.985,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
      if(p.y<innerHeight+30){alive++;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
        if(p.shape==='c'){x.beginPath();x.arc(0,0,p.w/2.4,0,7);x.fill()}else{x.scale(1,Math.cos(p.r*2));x.fillRect(-p.w/2,-p.h/2,p.w,p.h)}x.restore()}}
    if(alive)requestAnimationFrame(step);else c.remove()};
  requestAnimationFrame(step);setTimeout(()=>c.remove(),7000);
}

/* ---------- ALGORITMO (instrucciones del proyecto) ---------- */
function estimarGrasa(imc,edad,sexo){
  // Deurenberg (1991): %GC = 1,20·IMC + 0,23·edad − 10,8·sexo − 5,4  (hombre=1, mujer=0)
  return 1.2*imc+0.23*edad-10.8*(sexo==='Hombre'?1:0)-5.4;
}
function macros(cal,prot,gras){
  const carb=(cal-((prot*4)+(gras*9)))/4;
  return {kcal:R(cal),p:R(prot),g:R(gras),c:R(Math.max(0,carb)),carbNeg:carb<0};
}
function calcular(pf){
  const peso=+pf.peso,altura=+pf.altura,edad=+pf.edad,sexo=pf.sexo,actividad=+pf.actividad;
  const imc=peso/Math.pow(altura/100,2);
  const tiene=pf.grasa!=null&&pf.grasa!=='';
  const grasaEst=tiene?Number(pf.grasa):estimarGrasa(imc,edad,sexo);
  const obes=(sexo==='Mujer'&&grasaEst>30)||(sexo==='Hombre'&&grasaEst>25)||imc>30;
  const pc=obes?altura-100:peso;
  const tmb=sexo==='Mujer'?(10*peso)+(6.25*altura)-(5*edad)-161:(10*peso)+(6.25*altura)-(5*edad)+5;
  const get=tmb*actividad;
  const M=sexo==='Mujer';
  let plan;
  switch(Number(pf.enfoque)){
    case 1: plan={normal:macros(get*0.80,pc*2.0,pc*0.8)};break;
    case 2: plan={normal:macros(get*0.90,pc*2.2,M?pc*0.8:pc*0.9)};break;
    case 3: plan={normal:macros(get*1.05,M?pc*1.8:pc*2.0,pc*1.0)};break;
    case 4: plan={normal:macros(get*0.85,M?pc*2.3:pc*2.4,pc*0.7)};break;
    case 5: plan={normal:macros(get*1.0,pc*1.8,pc*1.0)};break;
    case 6: plan={entreno:macros(get*1.0,pc*2.0,pc*0.7),descanso:macros(get*0.85,pc*2.0,pc*1.1)};break;
  }
  return aplicarAjuste(pf,{imc,grasa:grasaEst,grasaFuente:tiene?'indicada':'estimada',estado:obes?'Obesidad':'Normal',pc,tmb:R(tmb),get:R(get),plan});
}

/* ---------- Ajuste de calorías (ritmo elegido por la persona) ---------- */
const KCAL_KG=7700;
const FLOOR=s=>s==='Mujer'?1200:1500;
function ajusteKcal(pf,get){
  const a=pf.ajuste||{};
  if(a.modo==='ritmo'&&a.ritmo>0)return get-a.ritmo*KCAL_KG/7;
  if(a.modo==='fecha'){const dias=(parse(a.fechaObj||today())-parse(today()))/864e5,kg=(+pf.peso)-(+a.pesoObj);
    if(!(dias>=7)||!(kg>0)||!a.pesoObj)return null;return get-kg*KCAL_KG/dias}
  if(a.modo==='fijo'&&+a.kcal>=500)return +a.kcal;
  return null;
}
function macrosAj(cal,m,pc){
  // Se mantiene la proteína del enfoque; si no caben, se baja la grasa (mínimo 0,6 g/kg) y los carbohidratos absorben el resto.
  let g=m.g;const minG=Math.round(pc*0.6);
  if((cal-m.p*4-g*9)/4<0)g=Math.max(minG,Math.floor((cal-m.p*4)/9));
  return macros(cal,m.p,g);
}
function aplicarAjuste(pf,r){
  const a=pf.ajuste||{modo:'recomendado'},nE=(pf.dias||[]).length;
  const avg=p=>p.normal?p.normal.kcal:(p.entreno.kcal*nE+p.descanso.kcal*(7-nE))/7;
  const rec=avg(r.plan);
  const info={modo:a.modo||'recomendado',recomendado:R(rec),avisos:[]};
  let want=ajusteKcal(pf,r.get);
  if(info.modo!=='recomendado'&&want==null)info.invalido=true;
  if(want!=null){
    const fl=FLOOR(pf.sexo);
    if(want<fl){info.avisos.push(`Lo hemos subido a ${fmt(fl)} kcal: por debajo no es recomendable sin supervisión profesional.`);want=fl;info.limitado=true}
    const d=want-rec;r.base=r.plan;
    r.plan=r.plan.normal?{normal:macrosAj(want,r.plan.normal,r.pc)}:{entreno:macrosAj(r.plan.entreno.kcal+d,r.plan.entreno,r.pc),descanso:macrosAj(r.plan.descanso.kcal+d,r.plan.descanso,r.pc)};
  }
  const media=avg(r.plan);info.kcal=R(media);info.kgSem=(r.get-media)*7/KCAL_KG;
  if(media<r.tmb)info.avisos.push('Estás por debajo de tu metabolismo basal: mejor usarlo solo por temporadas cortas.');
  if(info.kgSem>(+pf.peso)*0.01)info.avisos.push('Ritmo muy agresivo (más del 1% de tu peso por semana): puedes perder músculo y energía.');
  if(Object.values(r.plan).some(m=>m.carbNeg))info.avisos.push('Con tan pocas calorías no caben los carbohidratos: revisa el número.');
  r.ajuste=info;return r;
}
function ajusteLabel(pf){
  const a=pf.ajuste||{};
  return a.modo==='ritmo'?`Ritmo de ${String(a.ritmo).replace('.',',')} kg por semana`:a.modo==='fecha'?`Llegar a ${fmt1(a.pesoObj)} kg el ${fmtD(a.fechaObj)}`:a.modo==='fijo'?`${fmt(a.kcal)} kcal fijas al día`:'Recomendado por tu enfoque';

const OFF_FIELDS='code,product_name,product_name_es,brands,quantity,serving_quantity,serving_size,nutriments';
function offMap(p){
  const n=p.nutriments||{};
  let k=n['energy-kcal_100g'];
  if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
  const name=(p.product_name_es||p.product_name||'').trim();
  if(!name)return null;
  const brand=Array.isArray(p.brands)?p.brands[0]:(p.brands||'').split(',')[0];
  // Ficha sin datos nutricionales: se muestra igualmente para poder copiarlos de la etiqueta
  if(k==null)return {id:'o'+p.code,code:p.code,n:name+(brand?' · '+brand.trim():''),nodata:true,src:'off'};
  const r1=x=>Math.round((Number(x)||0)*10)/10;
  const sq=Number(p.serving_quantity);
  return {id:'o'+p.code,code:p.code,n:name+(brand?' · '+brand.trim():''),k:Math.round(k),p:r1(n.proteins_100g),c:r1(n.carbohydrates_100g),g:r1(n.fat_100g),src:'off',
    ...(sq>0&&sq<2000?{ug:Math.round(sq*10)/10,un:'ración',unp:'raciones'}:{})};
}
const IN_PREVIEW=!!(window.claude&&window.claude.use)||/claude\.ai|claudeusercontent/.test(location.hostname)||location.protocol==='file:';
const OFF_OFFLINE=IN_PREVIEW?'No se puede conectar con Open Food Facts desde esta vista previa. Úsalo en tu web: https://ninnx3.github.io/VUELVE/':'No se pudo conectar con Open Food Facts. Revisa tu conexión y vuelve a intentarlo en unos segundos.';
async function offFetch(url){
  let r;
  try{r=await fetch(url,{headers:{'Accept':'application/json'}})}catch(e){throw new Error(OFF_OFFLINE)}
  if(r.status===429)throw new Error('Open Food Facts limita las búsquedas por minuto. Espera unos segundos y vuelve a intentarlo.');
  if(!r.ok)throw new Error('Open Food Facts no responde ahora mismo ('+r.status+').');
  return r.json();
}

// En Open Food Facts los productos van por marca, no por supermercado
const SUPER_MARCA=[[/\bmercadona\b/gi,'hacendado'],[/\balcampo\b/gi,'auchan'],[/\bd[ií]a\b(?=\s*$)/gi,'dia']];
async function offSearch(q0){
  let q=q0;for(const [re,m] of SUPER_MARCA)q=q.replace(re,m);q=q.replace(/\s+/g,' ').trim();
  const key=q.toLowerCase().trim();if(OFF_CACHE[key])return OFF_CACHE[key];
  let out=[],err=null;
  // 1) Buscador moderno de Open Food Facts (Search-a-licious), limitado a productos vendidos en España
  try{
    const u='https://search.openfoodfacts.org/search?page_size=30&langs=es&fields='+OFF_FIELDS+'&q='+encodeURIComponent(q+' countries_tags:"en:spain"');
    const j=await offFetch(u);out=(j.hits||j.products||[]).map(offMap).filter(Boolean);
  }catch(e){err=e}
  // 2) Buscador clásico como respaldo
  if(!out.length){
    try{
      const u='https://world.openfoodfacts.org/cgi/search.pl?action=process&json=1&search_simple=1&page_size=30'
        +'&tagtype_0=countries&tag_contains_0=contains&tag_0=spain&sort_by=unique_scans_n'
        +'&fields='+OFF_FIELDS+'&search_terms='+encodeURIComponent(q);
      const j=await offFetch(u);out=(j.products||[]).map(offMap).filter(Boolean);err=null;
    }catch(e){if(!err)err=e}
  }
  if(!out.length&&err)throw err;
  const seen=new Set();out=out.filter(f=>!seen.has(f.id)&&seen.add(f.id));
  out=[...out.filter(f=>!f.nodata),...out.filter(f=>f.nodata)];
  OFF_CACHE[key]=out;return out;
}
async function offBarcode(code){
  const j=await offFetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+OFF_FIELDS);
  if(j.status!==1||!j.product)return null;
  return offMap({...j.product,code});
}
function rememberOff(u,f){
  u.off=u.off||[];

        <button class="btn block" style="margin-top:4px" id="asub">${mode==='registro'?'Crear cuenta y empezar →':'Entrar →'}</button>
        ${SERVER&&mode==='login'?'<p style="text-align:center;margin-top:14px"><a href="#" id="forgot" class="small" style="font-weight:600">¿Has olvidado tu contraseña?</a></p>':''}
      </form>
      <div class="note">${SERVER?'🔒 ':'🧪 <b>Modo prueba.</b> Puedes crear tantas cuentas falsas como quieras. '}<span id="authsync">${authNote()}</span></div>
    </div>
  </div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>renderAuth(b.dataset.m));
  if($('#forgot'))$('#forgot').onclick=async e=>{e.preventDefault();const email=$('[name=email]').value.trim().toLowerCase();
    if(!email){$('#aerr').textContent='Escribe tu email arriba y vuelve a pulsar.';return}
    const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});
    $('#aerr').textContent='';toast(error?sbErr(error):'Te hemos enviado un email para cambiar la contraseña')};
  $('#af').onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),pass=f.get('pass');
    const d=load(),err=$('#aerr');
    if(SERVER){
      const btn=$('#asub');btn.disabled=true;err.textContent='';
      const rm=$('#remem');try{localStorage.setItem('vuelve_recordar',rm&&!rm.checked?'0':'1');if(!rm||rm.checked)localStorage.setItem('vuelve_email',email);else localStorage.removeItem('vuelve_email')}catch(x){}
      try{
        if(mode==='registro'){
          const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{nombre:f.get('nombre').trim()},emailRedirectTo:APP_URL}});
          if(error)throw error;
          if(!data.session){$('.box').innerHTML=`<div class="logo">${LOGO}<div><b>VUELVE</b><small>Un día a la vez</small></div></div>
            <div style="font-size:48px;margin-top:36px">💌</div><h1 class="h1" style="margin-top:8px">Revisa tu <span>email.</span></h1>
            <p class="muted" style="margin-top:10px">Te hemos enviado un enlace a <b>${esc(email)}</b> para confirmar tu cuenta. Ábrelo desde este mismo móvil. Si no llega, mira en spam.</p>
            <button class="btn soft block" style="margin-top:20px" id="back">Ya lo he confirmado → Iniciar sesión</button>`;
            $('#back').onclick=()=>renderAuth('login',email);return}
          await sbLoadUser(data.user);
        }else{
          const {data,error}=await SB.auth.signInWithPassword({email,password:pass});if(error)throw error;
          await sbLoadUser(data.user);
        }
        route();
      }catch(x){err.textContent=sbErr(x);btn.disabled=false}
      return;
    }
    if(mode==='registro'){
      if(d.users[email]){err.textContent='Ya existe una cuenta con ese email. Inicia sesión.';return}
      d.users[email]={email,nombre:f.get('nombre').trim(),pass:await hash(pass),creada:today(),profile:null,logs:{},weights:[],favs:[],custom:[],off:[]};
      d.session=email;save();route();
    }else{
      const u=d.users[email];
      if(!u||u.pass!==await hash(pass)){err.textContent='Email o contraseña incorrectos.';return}
      d.session=email;save();route();
    }
  };
}

let OB=null;
function startOnboarding(editing=false){
  const u=me();
  SCREEN.busy=true;
  OB={step:editing?1:0,editing,d:Object.assign({sexo:null,edad:'',altura:'',peso:'',grasa:'',actividad:null,enfoque:null,dias:[1,3,5],meta:'',metaNombre:''},JSON.parse(JSON.stringify(u.profile||{})))};
  if(OB.d.grasa==null)OB.d.grasa='';
  renderOB();
}
const STEPS=['bienvenida','sexo','cuerpo','grasa','actividad','enfoque','dias','meta','ritmo'];
const okCuerpo=d=>d.edad>=14&&d.edad<=100&&d.altura>=120&&d.altura<=230&&d.peso>=30&&d.peso<=300;
const okGrasa=d=>d.grasa===''||(d.grasa>=3&&d.grasa<=70);
function renderOB(){
  const u=me(),s=STEPS[OB.step],d=OB.d,tot=STEPS.length;
  let body='',ok=true;
  if(s==='bienvenida'){
    body=`<p class="eyebrow">Hola, ${esc(u.nombre)}</p><h2 class="h1" style="margin-top:10px">Vamos a calcular <span>tus números.</span></h2>

    <div class="card" style="margin-top:10px"><div class="opt" style="border:0;padding:0;background:none"><span class="ic">🌿</span><div><b>Sin juicios</b><small>Son solo tu punto de partida. Vuelve por encima de perfección.</small></div></div></div>

    body=`<p class="eyebrow">Paso 1 de 8</p><h2 class="h2" style="margin-top:10px">¿Cuál es tu <span>sexo biológico?</span></h2><p class="lead">Lo usamos en la fórmula del metabolismo basal (Mifflin-St Jeor).</p>
    <div class="opts">${['Mujer','Hombre'].map(x=>`<button class="opt ${d.sexo===x?'on':''}" data-k="sexo" data-v="${x}"><span class="ic">${x==='Mujer'?'♀':'♂'}</span><div><b>${x}</b></div></button>`).join('')}</div>`;

  }
  if(s==='cuerpo'){
    body=`<p class="eyebrow">Paso 2 de 8</p><h2 class="h2" style="margin-top:10px">Cuéntame sobre <span>tu cuerpo.</span></h2><p class="lead">Datos de hoy, sin juzgar.</p>
    <label class="f"><span>Edad (años)</span><input class="in" type="number" inputmode="numeric" min="14" max="100" data-k="edad" value="${esc(d.edad)}" placeholder="Ej. 34"></label>
    <label class="f"><span>Altura (cm)</span><input class="in" type="number" inputmode="numeric" min="120" max="230" data-k="altura" value="${esc(d.altura)}" placeholder="Ej. 165"></label>
    <label class="f"><span>Peso actual (kg)</span><input class="in dec" type="text" inputmode="decimal" min="30" max="300" data-k="peso" value="${esc(dec(d.peso))}" placeholder="Ej. 68,5"></label>`;
    ok=okCuerpo(d);
  }
  if(s==='grasa'){
    const imc=d.peso/Math.pow(d.altura/100,2),est=estimarGrasa(imc,+d.edad,d.sexo);
    body=`<p class="eyebrow">Paso 3 de 8 · Opcional</p><h2 class="h2" style="margin-top:10px">¿Conoces tu <span>% de grasa?</span></h2>
    <p class="lead">Si te has medido con báscula de bioimpedancia, DEXA o pliegues, ponlo aquí. Si no, lo estimamos con tu IMC.</p>
    <label class="f"><span>% de grasa corporal</span><input class="in dec" type="text" inputmode="decimal" min="3" max="70" data-k="grasa" value="${esc(dec(d.grasa))}" placeholder="Déjalo vacío si no lo sabes"></label>

    <p class="small muted" style="margin-top:10px">Estimación de Deurenberg. Una medición real siempre es más precisa.</p>`;
    ok=okGrasa(d);

    body=`<p class="eyebrow">Paso 4 de 8</p><h2 class="h2" style="margin-top:10px">¿Cómo de activa es <span>tu semana?</span></h2><p class="lead">Piensa en una semana normal, con trabajo y ejercicio.</p>

    <div class="chips">${[1,2,3,4,5,6,0].map(i=>`<button class="chip ${d.dias.includes(i)?'on':''}" data-day="${i}">${DOW[i]}</button>`).join('')}</div>
    <p class="small muted" style="margin-top:12px">${d.dias.length} día${d.dias.length===1?'':'s'} por semana</p>`;

    body=`<p class="eyebrow">Paso 8 de 8</p><h2 class="h2" style="margin-top:10px">¿A qué ritmo <span>quieres ir?</span></h2>
    <p class="lead">Tu enfoque decide cómo se reparten los macros. Aquí eliges cuántas calorías comer: lo recomendado, un ritmo concreto, una fecha o un número exacto.</p><div id="ajw" style="margin-top:6px"></div>`;
  }
  if(s==='meta'){
    body=`<p class="eyebrow">Paso 7 de 8 · Opcional</p><h2 class="h2" style="margin-top:10px">¿Tienes una <span>fecha en mente?</span></h2><p class="lead">Un viaje, un evento, un cumpleaños… Te mostraremos una cuenta atrás.</p>
    <label class="f"><span>Fecha objetivo</span><input class="in" type="date" data-k="meta" value="${esc(d.meta)}" min="${today()}"></label>

    const u=me(),first=!u.profile;

}
function upsertWeight(u,date,kg){
  const w=u.weights.find(x=>x.date===date);
  if(w)w.kg=kg;else u.weights.push({date,kg});
  u.weights.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- Plan ---------- */
function planCard(m,titulo){
  const pc=R(m.p*4/m.kcal*100),cc=R(m.c*4/m.kcal*100),gc=R(m.g*9/m.kcal*100);
  return `<div class="plan">${titulo?`<p class="eyebrow" style="margin-bottom:8px">${titulo}</p>`:''}
    <div class="kc">${fmt(m.kcal)}<small> kcal / día</small></div>
    <div class="mm">
      <div><b style="color:var(--p)">${m.p}g</b><small>Proteínas<br>${fmt(m.p*4)} kcal · ${pc}%</small></div>
      <div><b style="color:var(--c)">${m.c}g</b><small>Carbohidratos<br>${fmt(m.c*4)} kcal · ${cc}%</small></div>
      <div><b style="color:var(--g)">${m.g}g</b><small>Grasas<br>${fmt(m.g*9)} kcal · ${gc}%</small></div>
    </div>
    ${m.carbNeg?'<p class="small" style="color:var(--warn);margin-top:10px">⚠️ Con estos datos, proteína y grasa ya superan las calorías objetivo; los carbohidratos se han fijado en 0 g. Revisa tus datos.</p>':''}
  </div>`;
}
function calcTable(r,pf){
  return `<table class="calc">
    <tr><td>IMC</td><td>${fmt1(r.imc)}</td></tr>
    <tr><td>% grasa (${r.grasaFuente}) <button class="edgrasa" style="color:var(--plum);font-weight:700;font-size:12px;text-decoration:underline">${r.grasaFuente==='estimada'?'¿Lo tienes medido?':'Cambiar'}</button></td><td>${fmt1(r.grasa)} %</td></tr>
    <tr><td>Tu peso (para las calorías)</td><td>${fmt1(+pf.peso)} kg</td></tr>
    <tr><td>Peso de referencia para proteína y grasa</td><td>${fmt1(r.pc)} kg${r.estado==='Obesidad'?' <span class="tiny muted">(altura − 100)</span>':''}</td></tr>
    <tr><td>Metabolismo basal (TMB)</td><td>${fmt(r.tmb)} kcal</td></tr>
    <tr><td>Mantenimiento (TMB × ${String(pf.actividad).replace('.',',')})</td><td>${fmt(r.get)} kcal</td></tr>
  </table>
  ${r.estado==='Obesidad'?`<div class="tip" style="background:var(--lilac);color:var(--plum)">ℹ️ <b>¿Por qué ${fmt1(r.pc)} kg y no ${fmt1(+pf.peso)} kg?</b> Cuando el % de grasa supera el ${pf.sexo==='Mujer'?'30':'25'}% (o el IMC pasa de 30), la proteína y la grasa se calculan sobre "altura − 100" para no pedirte más gramos de los que tu músculo necesita. Tus calorías sí usan tu peso real.${r.grasaFuente==='estimada'?' Tu % de grasa es una <b>estimación</b> por IMC: si te has medido (báscula de bioimpedancia, DEXA…), ponlo y el cálculo será más preciso.':''}</div>`:''}
  <p class="tiny muted" style="margin-top:10px">Metabolismo basal con la fórmula Mifflin-St Jeor.</p>`;
}

   APP

function dayLog(u,date){const l=u.logs[date]||(u.logs[date]={foods:[],mov:[],tipo:null});l.foods=l.foods||[];l.mov=l.mov||[];return l}
function peekLog(u,date){return u.logs[date]||{foods:[],mov:[],tipo:null}}
function isTrainDay(u,date){
  const l=u.logs[date];
  if(l&&l.tipo)return l.tipo==='entreno';
  if(l&&l.mov&&l.mov.length)return true;
  return u.profile.dias.includes(parse(date).getDay());
}
function targetFor(u,date){
  const r=calcular(u.profile);
  if(r.plan.normal)return r.plan.normal;
  return isTrainDay(u,date)?r.plan.entreno:r.plan.descanso;
}
function totals(foods){return (foods||[]).reduce((a,f)=>({k:a.k+f.k,p:a.p+f.p,c:a.c+f.c,g:a.g+f.g}),{k:0,p:0,c:0,g:0})}
const MET={Suave:3.5,Media:5.5,Alta:8};
function exKcal(u,mov){return (mov||[]).reduce((a,m)=>a+exKcalM(u,m),0)}

function renderApp(){

const APP_URL='https://ninnx3.github.io/VUELVE/';
const RETO_TIPOS={
  kcal:{t:'Días cumpliendo calorías',s:'Suma un punto cada día dentro de ±10% de tu objetivo',ic:'🍽️'},
  mov:{t:'Días de movimiento',s:'Suma un punto cada día que registres actividad',ic:'🏃‍♀️'},
  ambos:{t:'Combinado',s:'Un punto por comer en objetivo y otro por moverte',ic:'✨'}
};
function retosOf(u){return Object.values(load().retos||{}).filter(r=>r.miembros.includes(u.email))}
function pendingInvites(u){return Object.values(load().retos||{}).filter(r=>r.invitados.includes(u.email)&&!r.miembros.includes(u.email)&&!(r.rechazados||[]).includes(u.email))}
function retoFin(r){return addDays(r.inicio,r.dias-1)}
const diasEntre=(a,b)=>Math.round((parse(b)-parse(a))/864e5)+1;
function retoScore(r,email){
  const u=load().users[email];let kcal=0,mov=0;const end=retoFin(r)<today()?retoFin(r):today();
  if(!u||!u.profile){const rs=SERVER&&r.uids?RES[r.uids[email]]:null;if(!rs)return {pts:0,kcal:0,mov:0};
    for(const [f,x] of Object.entries(rs))if(f>=r.inicio&&f<=end){if(x.c)kcal++;if(x.m)mov++}}
  else for(let d=r.inicio;d<=end;d=addDays(d,1)){if(dayStatus(u,d)==='ok')kcal++;if((u.logs[d]?.mov||[]).length)mov++}
  const pts=r.tipo==='kcal'?kcal:r.tipo==='mov'?mov:kcal+mov;
  return {pts,kcal,mov};
}
function inviteText(u,r,para){
  return `¡Hola!\n\n${u.nombre} te invita a unirte a Vuelve y a hacer juntas el reto «${r.nombre}».\n\n`+
  `🏆 Reto: ${RETO_TIPOS[r.tipo].t}\n📅 ${r.dias} días, del ${fmtD(r.inicio)} al ${fmtD(retoFin(r))}\n\n`+
  `Vuelve calcula tus calorías y macros según tu cuerpo y tu objetivo, y te ayuda a registrar comidas y movimiento. Cada día que cumplas sumas puntos y veréis vuestra clasificación juntas.\n\n`+
  `Únete aquí y crea tu cuenta ${para?'con tu email '+para:'con el email con el que te he invitado'}: ${APP_URL}\n\nVuelve por encima de perfección. Un día a la vez. 💜`;
}
const CAN_SHARE=!!navigator.share&&!IN_CLAUDE;

  <a class="btn ${CAN_SHARE?'soft':''} block" style="margin-top:${CAN_SHARE?8:14}px;text-decoration:none;${CAN_SHARE?'':''}" id="wa" target="_blank" rel="noopener">💬 Enviar por WhatsApp</a>

      if([...r.miembros,...r.invitados].includes(v)&&!(r.rechazados||[]).includes(v))return err('Esa persona ya está en el reto.');

        nuevos.forEach(v=>{if(!r.invitados.includes(v))r.invitados.push(v);r.rechazados=(r.rechazados||[]).filter(x=>x!==v)});

      if(!nuevos.length){m.remove();return}

      const rr={...r,nombre:st.nombre.trim()||r.nombre,tipo:st.tipo,inicio:st.inicio,dias:n};

        <div class="mailbox">${esc(txt)}</div>
        ${shareHTML('mailto:'+nuevos.map(encodeURIComponent).join(',')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(txt))}`;
      m.querySelector('.close').onclick=()=>m.remove();
      bindShare(m,subj,txt)};
