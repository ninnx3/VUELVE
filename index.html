<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vuelve · Tu diario de nutrición</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#372333; --muted:#7d6c7a; --soft:#94738b; --accent:#a17998;
  --plum:#744a69; --plum-d:#5e3a55;
  --pink:#f4e1e8; --lilac:#eae3f3; --lilac-b:#dfd2e5; --beige:#f4ece0; --mint:#e3efe9;
  --tile:#f4f0f7; --seg:#ede7ee;
  --line:#e9e1e8; --bg:#fbf8fb; --green:#547969;
  --gold:#d4ac52; --base:#7aa898; --ex:#a99bd0; --food:#e2a08c;
  --p:#b0607f; --c:#c99a3b; --g:#7b5ea7; --warn:#c0504d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--plum)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 120px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.eyebrow{font-size:9px;font-weight:800;color:var(--soft);letter-spacing:1.5px;text-transform:uppercase}
.h1{font-size:40px;font-weight:800;letter-spacing:-2.2px;line-height:1.05}
.h1 span,.h2 span{font-weight:500;color:var(--accent)}
.h2{font-size:28px;font-weight:800;letter-spacing:-1.2px;line-height:1.1}
.h3{font-size:16px;font-weight:700}
@media(max-width:560px){.h1{font-size:34px;letter-spacing:-1.6px}.h2{font-size:24px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;background:var(--plum);color:#fff;font-weight:700;font-size:14px;transition:background .15s,transform .1s}
.btn:hover{background:var(--plum-d)}
.btn:active{transform:scale(.99)}
.btn.soft{background:var(--lilac);color:var(--plum);border:1px solid var(--lilac-b)}
.btn.soft:hover{background:#e2d8ef}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:11px;padding:10px 16px}
.btn.ghost:hover{background:var(--tile)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.danger{background:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Inputs */
label.f{display:block;margin-top:14px}
label.f>span{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;font-size:14px;font-weight:500;transition:border .15s}
.in:focus{border-color:var(--accent)}
.in::placeholder{color:#b4a7b1}
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].in::-webkit-calendar-picker-indicator{opacity:.6}
.grid2>*,.grid3>*{min-width:0}
.err{color:var(--warn);font-size:12px;margin-top:10px;min-height:16px}

/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:14px}
.tile{background:var(--tile);border-radius:16px;padding:16px}
.tile .lbl{font-size:12px;font-weight:700}
.tile .big{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:18px}
.tile .big small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}

/* Header */
header.app{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:20}
header.app .in2{max-width:1000px;margin:0 auto;padding:0 20px;height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:40px;height:40px;border-radius:10px;background:linear-gradient(140deg,#9b6b8d,#5e3a55);display:grid;place-items:center;color:#fff;font-weight:600;font-style:italic;font-size:12px;letter-spacing:-.3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.logo b{display:block;font-size:12px;font-weight:800;letter-spacing:.4px}
.logo small{display:block;font-size:9px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-top:2px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--lilac);color:var(--plum);display:grid;place-items:center;font-weight:800;font-size:15px;position:relative;box-shadow:0 0 0 3px #f3eef7}
.avatar i{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:8px;display:grid;place-items:center;font-style:normal;color:var(--muted)}
#sync{font-size:10px;font-weight:600;color:var(--muted);margin-right:12px;white-space:nowrap}
#sync.cloud{color:var(--green)}#sync.error{color:var(--warn)}
@media(max-width:560px){#sync{display:none}}

/* Bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,254,254,.96);backdrop-filter:blur(8px);box-shadow:0 -4px 25px rgba(64,40,60,.05);z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in2{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
nav.tabs button{padding:7px 4px;border-radius:12px;font-size:11px;color:var(--plum);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{background:var(--lilac)}
nav.tabs button:not(.on){color:var(--muted)}

/* Hero */
.hero{padding-top:34px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .eyebrow{margin-bottom:8px}
.strip{display:flex;justify-content:space-between;align-items:center;background:var(--lilac);border-radius:12px;padding:12px 16px;margin-top:22px;font-size:13px;color:var(--muted);font-weight:500}
.strip small{font-size:10px}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px;margin-top:20px}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--plum);color:#fff;box-shadow:0 3px 8px rgba(116,74,105,.16)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.datenav .ar{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.datenav .ar:hover{background:var(--tile)}
.datenav .t{text-align:center}
.datenav .t b{display:block;font-size:18px;font-weight:700;letter-spacing:-.4px}
.datenav .t small{font-size:10px;color:var(--muted)}

/* Summary */
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--lilac);color:var(--plum);display:grid;place-items:center;font-size:12px;font-weight:700}
.sum{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center;margin-top:14px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ctr b{font-size:34px;font-weight:700;letter-spacing:-1.3px;line-height:1;display:block}
.ring .ctr small{font-size:10px;color:var(--muted)}
.mac3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mac3 b{font-size:21px;font-weight:800;letter-spacing:-.8px}
.mac3 b small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.mac3 .l{font-size:12px;color:var(--muted)}
.mac3 .mb{height:4px;border-radius:4px;background:var(--line);margin:8px auto 0;max-width:110px;overflow:hidden}
.mac3 .mb i{display:block;height:100%;border-radius:4px}
@media(max-width:560px){.sum{grid-template-columns:1fr;justify-items:center}.mac3{width:100%}.mac3 b{font-size:17px}}
.daytype{display:flex;gap:6px;margin-top:16px;background:var(--seg);padding:4px;border-radius:12px}
.daytype button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:12px;color:var(--muted)}
.daytype button.on{background:#fff;color:var(--plum);box-shadow:0 2px 6px rgba(116,74,105,.1)}

/* Energy */
.energy{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:#fbfcfb}
.ebar{position:relative;height:24px;border-radius:12px;background:var(--line);margin-top:36px;overflow:visible}
.ebar .seg1{position:absolute;left:0;top:0;bottom:0;border-radius:12px 0 0 12px;background:var(--base)}
.ebar .seg2{position:absolute;top:0;bottom:0;border-radius:0 12px 12px 0;background:var(--ex)}
.ebar .fd{position:absolute;left:0;bottom:0;height:12px;border-radius:0 0 0 12px;background:var(--food)}
.ebar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--plum)}
.ebar .mk span{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--lilac);color:var(--plum);font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.deficit{display:flex;justify-content:space-between;align-items:center;background:var(--mint);border-radius:10px;padding:12px 12px;margin-top:14px}
.deficit b{font-size:20px;font-weight:800;letter-spacing:-.6px}
details.how{margin-top:16px}
details.how summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
details.how summary::before{content:'▸ ';font-size:10px}
details.how[open] summary::before{content:'▾ '}
.foot{text-align:center;font-size:10px;color:var(--soft);margin:22px 0}

/* Meals */
.meal{padding:14px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:4px}
.meal .h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;gap:10px}
.item .n{flex:1;min-width:0}
.item .n small{display:block;color:var(--muted);font-size:11px}
.item .k{font-weight:700;white-space:nowrap}
.x{color:var(--muted);width:26px;height:26px;border-radius:8px;flex-shrink:0}
.x:hover{background:var(--pink);color:var(--warn)}
.plus{width:32px;height:32px;border-radius:50%;background:var(--lilac);color:var(--plum);font-size:18px;font-weight:600;flex-shrink:0}
.plus:hover{background:#e0d4ee}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(55,35,51,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fdfafc;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px;padding:20px;animation:pop .2s;box-shadow:0 20px 50px rgba(55,35,51,.18)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.sheet .top b{font-size:16px;font-weight:700}
.close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--muted)}
.back{font-size:10px;color:var(--muted);margin-top:8px;font-weight:600}
.back:hover{color:var(--plum)}
.mealpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mealpick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.mealpick button span{font-size:18px}
.mealpick button.on{background:var(--lilac);border-color:var(--accent);color:var(--plum)}
.ways{display:grid;gap:10px;margin-top:16px}
.way{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px}
.way:hover{border-color:var(--accent);background:#fff}
.way .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.way b{display:block;font-size:14px}
.way small{color:var(--muted);font-size:12px}
.subseg{display:flex;background:var(--seg);border-radius:10px;padding:3px;margin-top:12px}
.subseg button{flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:600;color:var(--muted)}
.subseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.searchrow{display:flex;gap:8px;margin-top:10px}
.results{margin-top:14px;max-height:48vh;overflow:auto;padding-right:4px}
.rcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.rcard:hover{border-color:var(--lilac-b)}
.rcard b{font-size:13px;font-weight:700;display:block}
.rcard .k{font-size:12px;color:var(--ink)}
.rcard small{display:block;font-size:10px;color:var(--muted)}
.star{font-size:16px;color:#d9cfd7;width:28px;height:28px}
.star.on{color:var(--gold)}
.notfound{font-size:11px;color:var(--muted);margin-top:12px;font-weight:500}
.notfound a{color:var(--plum);font-weight:600;text-decoration:none}
.pv{background:var(--tile);border-radius:12px;padding:14px;margin-top:12px}

/* Countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cd div{border-radius:10px;padding:8px 6px 6px}
.cd b{font-size:26px;font-weight:800;display:block;line-height:1.05;letter-spacing:-1px}
.cd small{font-size:8px;font-weight:800;letter-spacing:.6px}
.cd div:nth-child(1){background:var(--pink);color:#8a4f6e}
.cd div:nth-child(2){background:var(--lilac);color:#7b5ea7}
.cd div:nth-child(3){background:var(--beige);color:#a88445}
.cd div:nth-child(4){background:var(--mint);color:var(--green)}

/* Lists, tables */
table.calc{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.calc td{padding:9px 0;border-bottom:1px solid var(--line)}
table.calc td:last-child{text-align:right;font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--lilac);color:var(--plum)}
.pill.ok{background:var(--mint);color:var(--green)}
.pill.warn{background:var(--pink);color:#8a4f6e}
.wk{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.wk:last-child{border-bottom:0}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{font-size:24px;font-weight:800;letter-spacing:-1px;display:block}
.stat small{font-size:9px;color:var(--soft);text-transform:uppercase;letter-spacing:1.2px;font-weight:800}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.plan{border-radius:16px;padding:18px;background:var(--tile);margin-top:12px}
.plan .kc{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1}
.plan .kc small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.plan .mm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.plan .mm div{background:#fff;border-radius:12px;padding:12px 8px;text-align:center}
.plan .mm b{font-size:20px;font-weight:800;display:block;letter-spacing:-.6px}
.plan .mm small{font-size:10px;color:var(--muted);display:block;line-height:1.35}

/* Week/month */
.dayrow{display:grid;grid-template-columns:90px 1fr 92px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.dayrow:last-child{border-bottom:0}
.dayrow:hover b{color:var(--plum)}
.minibar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.minibar i{display:block;height:100%;border-radius:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .hd{text-align:center;font-size:9px;font-weight:800;color:var(--soft);letter-spacing:1px}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;position:relative}
.cal .c.out{background:transparent;color:#cdbfc9;cursor:default}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--plum)}
.cal .c.ok{background:var(--mint);color:var(--green)}
.cal .c.reg{background:var(--pink);color:#8a4f6e}
.cal .c .g{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ex)}

/* Auth & onboarding */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .art{background:linear-gradient(160deg,var(--pink),var(--lilac) 60%,#e3d7ee);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:40px}
.auth .art .bubble{position:absolute;border-radius:50%;opacity:.55}
.auth .art blockquote{position:relative;font-size:30px;font-weight:800;letter-spacing:-1.3px;line-height:1.12;color:var(--plum-d);max-width:380px}
.auth .art blockquote span{font-weight:500;color:var(--accent)}
.auth .box{display:flex;flex-direction:column;justify-content:center;padding:40px;max-width:480px;width:100%;margin:0 auto}
@media(max-width:800px){.auth{grid-template-columns:1fr}.auth .art{display:none}}
.note{margin-top:18px;font-size:11px;color:var(--muted);background:var(--tile);padding:12px 14px;border-radius:12px;line-height:1.5}
.ob{max-width:600px;margin:0 auto;padding:0 20px 140px}
.ob-top{position:sticky;top:0;background:var(--bg);padding:18px 0 12px;z-index:5}
.pbar{height:5px;background:var(--seg);border-radius:9px;overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;background:var(--plum);border-radius:9px;transition:width .3s}
.ob .lead{color:var(--muted);margin-top:10px;font-size:14px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;gap:12px;align-items:center;transition:.15s}
.opt:hover{border-color:var(--lilac-b)}
.opt.on{border-color:var(--plum);background:var(--lilac)}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.opt.on .ic{background:#fff}
.opt b{display:block;font-size:14px}
.opt small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
.ob-nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:28px 20px 20px}
.ob-nav .in2{max-width:600px;margin:0 auto;display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:99;animation:pop .2s}
textarea.in{min-height:90px;resize:vertical;font-size:11px;font-family:ui-monospace,monospace}
.welcome{display:grid;grid-template-columns:1fr 1.1fr;max-width:680px;padding:0;overflow:hidden}
.welcome .l{background:linear-gradient(160deg,var(--pink),var(--lilac));min-height:320px;overflow:hidden}.welcome .l svg{display:block}
.welcome .r{padding:28px 24px;position:relative}
@media(max-width:600px){.welcome{grid-template-columns:1fr}.welcome .l{min-height:200px;height:200px}}

/* Avatar dropdown */
.dd-wrap{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 10px);width:290px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(55,35,51,.14);padding:8px;z-index:40;animation:pop .15s}

<body>
<div id="root"></div>

<script>
/* =========================================================
   VUELVE · Prototipo
   Guardado: nube (cuenta de Claude del visitante) cuando está
   disponible; si no, este navegador (localStorage).
   ========================================================= */

/* ---------- Almacenamiento local ---------- */
const KEY='vuelve_proto_v1';
let MEM=null;
function load(){
  if(MEM) return MEM;
  try{MEM=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}
  if(!MEM) MEM={users:{},session:null};
  return MEM;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(MEM))}catch(e){}}
function save(){saveLocal();cloudQueue()}
function me(){const d=load();return d.session?d.users[d.session]:null}

/* ---------- Guardado en la nube ---------- */
const CLOUD={db:null,uid:null,state:'local',last:{},timer:null,busy:false,again:false};
const SYNC_TXT={local:'● Guardado en este navegador',saving:'● Guardando…',cloud:'● Guardado en la nube',error:'● Error al guardar en la nube'};
function setSync(s){CLOUD.state=s;const e=document.getElementById('sync');if(e){e.textContent=SYNC_TXT[s];e.className=s}
  const a=document.getElementById('authsync');if(a)a.textContent=CLOUD.db?'Se guardan en la nube, ligadas a tu sesión de Claude.':'Se guardan en este navegador.'}
const ekey=e=>e.replace(/[^a-zA-Z0-9_\-.~:@+]/g,'_');
function toDocs(){
  const d=load(),docs={},accounts={session:d.session,users:{},retos:d.retos||{}};
  for(const [em,u] of Object.entries(d.users)){
    const {logs,mealprep,...rest}=u;accounts.users[em]=rest;
    if(mealprep)docs['mp~'+ekey(em)]={email:em,json:JSON.stringify(mealprep)};
    const byM={};
    for(const [date,l] of Object.entries(logs||{})){
      if(!(l.foods||[]).length&&!(l.mov||[]).length&&!l.tipo)continue;
      (byM[date.slice(0,7)]=byM[date.slice(0,7)]||{})[date]=l;
    }
    for(const [m,days] of Object.entries(byM))docs['log~'+ekey(em)+'~'+m]={email:em,month:m,json:JSON.stringify(days)};
  }
  docs.accounts={json:JSON.stringify(accounts)};
  return docs;
}
function cloudQueue(){
  if(!CLOUD.db)return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer=setTimeout(flush,600);
}
async function flush(){
  if(!CLOUD.db)return;
  if(CLOUD.busy){CLOUD.again=true;return}
  CLOUD.busy=true;
  try{
    const docs=toDocs(),col=CLOUD.db.collection('data/users/'+CLOUD.uid);
    let wrote=false;
    for(const [id,body] of Object.entries(docs)){
      const s=JSON.stringify(body);if(CLOUD.last[id]===s)continue;
      if(!wrote){setSync('saving');wrote=true}
      await col.doc(id).set(body);CLOUD.last[id]=s;
    }
    for(const id of Object.keys(CLOUD.last))if(!docs[id]){await col.doc(id).delete();delete CLOUD.last[id]}
    setSync('cloud');
  }catch(e){console.warn('Vuelve cloud',e);setSync('error')}
  CLOUD.busy=false;
  if(CLOUD.again){CLOUD.again=false;flush()}
}
async function initCloud(){
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use))return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const col=db.collection('data/users/'+uid);
    const snap=await Promise.race([col.get(),new Promise((_,ko)=>setTimeout(()=>ko(new Error('timeout')),10000))]);
    CLOUD.db=db;CLOUD.uid=uid;
    const loc=load();
    if(snap.empty){setSync('cloud');if(Object.keys(loc.users).length)flush();return}
    const remote={users:{},session:null,retos:{}};const logs=[],mps=[];
    snap.docs.forEach(d=>{const b=d.data();CLOUD.last[d.id]=JSON.stringify(b);
      if(d.id==='accounts'){const a=JSON.parse(b.json);remote.session=a.session;remote.retos=a.retos||{};for(const [em,u] of Object.entries(a.users))remote.users[em]={...u,logs:{}}}
      else if(d.id.startsWith('log~'))logs.push(b);
      else if(d.id.startsWith('mp~'))mps.push(b)});
    logs.forEach(b=>{const u=remote.users[b.email];if(u)Object.assign(u.logs,JSON.parse(b.json))});
    mps.forEach(b=>{const u=remote.users[b.email];if(u)u.mealprep=JSON.parse(b.json)});
    for(const [em,u] of Object.entries(loc.users))if(!remote.users[em])remote.users[em]=u;
    for(const [id,r] of Object.entries(loc.retos||{}))if(!remote.retos[id])remote.retos[id]=r;
    if(loc.session&&remote.users[loc.session])remote.session=loc.session;
    MEM=remote;saveLocal();setSync('cloud');flush();
    if(!SCREEN.busy)route();
  }catch(e){console.warn('Vuelve cloud init',e);setSync('local')}
}

async function hash(s){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vuelve:'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'f'+h}
}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const R=Math.round;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const DOW=['D','L','M','X','J','V','S'];
const DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON=MONL.map(m=>m.slice(0,3));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=n=>new Intl.NumberFormat('es-ES').format(R(n));
const fmt1=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:1}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const SCREEN={busy:false};

/* ---------- Enfoques ---------- */
const ENFOQUES={
  1:{ic:'🔥',t:'Perder grasa y mantener músculo',s:'Definición tradicional · déficit del 20%'},
  2:{ic:'⚖️',t:'Perder grasa y aumentar músculo',s:'Recomposición clásica · déficit del 10%'},
  3:{ic:'💪',t:'Volumen limpio',s:'Ganancia estética, músculo sin grasa · superávit del 5%'},
  4:{ic:'✨',t:'Esculpe y define',s:'Grasa rebelde y líquidos extracelulares · déficit del 15%'},
  5:{ic:'🦴',t:'Densidad ósea y longevidad',s:'Salud y antienvejecimiento · mantenimiento'},
  6:{ic:'🔄',t:'Flexibilidad metabólica',s:'Ciclado de nutrientes · entreno vs. descanso'}
};
const ACT=[
  {v:1.2,t:'Sedentaria',s:'Trabajo sentado, poco o ningún ejercicio',ic:'🪑'},
  {v:1.375,t:'Actividad ligera',s:'Ejercicio suave 1–3 días por semana',ic:'🚶‍♀️'},
  {v:1.55,t:'Actividad moderada',s:'Ejercicio 3–5 días por semana',ic:'🚴‍♀️'},
  {v:1.725,t:'Actividad alta',s:'Ejercicio intenso 6–7 días por semana',ic:'🏋️‍♀️'}
];

/* ---------- ALGORITMO (instrucciones del proyecto) ---------- */
function estimarGrasa(imc,edad,sexo){
  // Deurenberg (1991): %GC = 1,20·IMC + 0,23·edad − 10,8·sexo − 5,4  (hombre=1, mujer=0)
  return 1.2*imc+0.23*edad-10.8*(sexo==='Hombre'?1:0)-5.4;
}
function macros(cal,prot,gras){
  const carb=(cal-((prot*4)+(gras*9)))/4;
  return {kcal:R(cal),p:R(prot),g:R(gras),c:R(Math.max(0,carb)),carbNeg:carb<0};
}
function calcular(pf){
  const peso=+pf.peso,altura=+pf.altura,edad=+pf.edad,sexo=pf.sexo,actividad=+pf.actividad;
  const imc=peso/Math.pow(altura/100,2);
  const tiene=pf.grasa!=null&&pf.grasa!=='';
  const grasaEst=tiene?Number(pf.grasa):estimarGrasa(imc,edad,sexo);
  const obes=(sexo==='Mujer'&&grasaEst>30)||(sexo==='Hombre'&&grasaEst>25)||imc>30;
  const pc=obes?altura-100:peso;
  const tmb=sexo==='Mujer'?(10*peso)+(6.25*altura)-(5*edad)-161:(10*peso)+(6.25*altura)-(5*edad)+5;
  const get=tmb*actividad;
  const M=sexo==='Mujer';
  let plan;
  switch(Number(pf.enfoque)){
    case 1: plan={normal:macros(get*0.80,pc*2.0,pc*0.8)};break;
    case 2: plan={normal:macros(get*0.90,pc*2.2,M?pc*0.8:pc*0.9)};break;
    case 3: plan={normal:macros(get*1.05,M?pc*1.8:pc*2.0,pc*1.0)};break;
    case 4: plan={normal:macros(get*0.85,M?pc*2.3:pc*2.4,pc*0.7)};break;
    case 5: plan={normal:macros(get*1.0,pc*1.8,pc*1.0)};break;
    case 6: plan={entreno:macros(get*1.0,pc*2.0,pc*0.7),descanso:macros(get*0.85,pc*2.0,pc*1.1)};break;
  }
  return aplicarAjuste(pf,{imc,grasa:grasaEst,grasaFuente:tiene?'indicada':'estimada',estado:obes?'Obesidad':'Normal',pc,tmb:R(tmb),get:R(get),plan});
}

/* ---------- Ajuste de calorías (ritmo elegido por la persona) ---------- */
const KCAL_KG=7700;
const FLOOR=s=>s==='Mujer'?1200:1500;
function ajusteKcal(pf,get){
  const a=pf.ajuste||{};
  if(a.modo==='ritmo'&&a.ritmo>0)return get-a.ritmo*KCAL_KG/7;
  if(a.modo==='fecha'){const dias=(parse(a.fechaObj||today())-parse(today()))/864e5,kg=(+pf.peso)-(+a.pesoObj);
    if(!(dias>=7)||!(kg>0)||!a.pesoObj)return null;return get-kg*KCAL_KG/dias}
  if(a.modo==='fijo'&&+a.kcal>=500)return +a.kcal;
  return null;
}
function macrosAj(cal,m,pc){
  // Se mantiene la proteína del enfoque; si no caben, se baja la grasa (mínimo 0,6 g/kg) y los carbohidratos absorben el resto.
  let g=m.g;const minG=Math.round(pc*0.6);
  if((cal-m.p*4-g*9)/4<0)g=Math.max(minG,Math.floor((cal-m.p*4)/9));
  return macros(cal,m.p,g);
}
function aplicarAjuste(pf,r){
  const a=pf.ajuste||{modo:'recomendado'},nE=(pf.dias||[]).length;
  const avg=p=>p.normal?p.normal.kcal:(p.entreno.kcal*nE+p.descanso.kcal*(7-nE))/7;
  const rec=avg(r.plan);
  const info={modo:a.modo||'recomendado',recomendado:R(rec),avisos:[]};
  let want=ajusteKcal(pf,r.get);
  if(info.modo!=='recomendado'&&want==null)info.invalido=true;
  if(want!=null){
    const fl=FLOOR(pf.sexo);
    if(want<fl){info.avisos.push(`Lo hemos subido a ${fmt(fl)} kcal: por debajo no es recomendable sin supervisión profesional.`);want=fl;info.limitado=true}
    const d=want-rec;r.base=r.plan;
    r.plan=r.plan.normal?{normal:macrosAj(want,r.plan.normal,r.pc)}:{entreno:macrosAj(r.plan.entreno.kcal+d,r.plan.entreno,r.pc),descanso:macrosAj(r.plan.descanso.kcal+d,r.plan.descanso,r.pc)};
  }
  const media=avg(r.plan);info.kcal=R(media);info.kgSem=(r.get-media)*7/KCAL_KG;
  if(media<r.tmb)info.avisos.push('Estás por debajo de tu metabolismo basal: mejor usarlo solo por temporadas cortas.');
  if(info.kgSem>(+pf.peso)*0.01)info.avisos.push('Ritmo muy agresivo (más del 1% de tu peso por semana): puedes perder músculo y energía.');
  if(Object.values(r.plan).some(m=>m.carbNeg))info.avisos.push('Con tan pocas calorías no caben los carbohidratos: revisa el número.');
  r.ajuste=info;return r;
}
function ajusteLabel(pf){
  const a=pf.ajuste||{};
  return a.modo==='ritmo'?`Ritmo de ${String(a.ritmo).replace('.',',')} kg por semana`:a.modo==='fecha'?`Llegar a ${fmt1(a.pesoObj)} kg el ${fmtD(a.fechaObj)}`:a.modo==='fijo'?`${fmt(a.kcal)} kcal fijas al día`:'Recomendado por tu enfoque';
}
function ajusteEditor(el,pf,onValid){
  pf.ajuste=pf.ajuste||{modo:'recomendado'};const a=pf.ajuste;
  const r0=calcular({...pf,ajuste:{modo:'recomendado'}}),rec=r0.ajuste.recomendado,get=r0.get;
  const RIT=[[0.25,'Suave'],[0.5,'Moderado'],[0.75,'Intenso'],[1,'Máximo']];
  const kRit=v=>R(Math.max(FLOOR(pf.sexo),get-v*KCAL_KG/7));
  const opt=(m,ic,t,s)=>`<button class="opt ${a.modo===m?'on':''}" data-am2="${m}"><span class="ic">${ic}</span><div><b>${t}</b><small>${s}</small></div></button>`;
  const prev=()=>{
    const r=calcular(pf),j=r.ajuste,p=el.querySelector('#ajprev');
    if(j.invalido){p.innerHTML=`<div class="tip" style="background:var(--beige);color:#7a5a2a">${a.modo==='fecha'?'Indica un peso objetivo menor que tu peso actual y una fecha a más de una semana.':'Escribe tus calorías (mínimo 500).'}</div>`;onValid&&onValid(false);return}
    const k=j.kgSem,dif=R(r.get-j.kcal);
    let linea=Math.abs(k)<0.03?'Mantenimiento: ni déficit ni superávit.':k>0?`Déficit medio de <b>${fmt(dif)} kcal/día</b> · ≈ <b>−${fmt1(k)} kg por semana</b>`:`Superávit medio de <b>${fmt(-dif)} kcal/día</b> · ≈ <b>+${fmt1(-k)} kg por semana</b>`;
    if(k>0.03){const kgObj=a.modo==='fecha'?+a.pesoObj:null;
      if(kgObj){const dias=(parse(a.fechaObj)-parse(today()))/864e5;linea+=`<br>En ${R(dias)} días llegarías a ≈ ${fmt1(+pf.peso-k*dias/7)} kg.`}}
    p.innerHTML=(r.plan.normal?planCard(r.plan.normal):planCard(r.plan.entreno,'Días de entreno')+planCard(r.plan.descanso,'Días de descanso'))+
      `<p class="small" style="margin-top:12px">${linea}</p>`+j.avisos.map(t=>`<div class="tip" style="background:var(--beige);color:#7a5a2a">⚠️ ${t}</div>`).join('')+
      `<p class="tiny muted" style="margin-top:10px">Estimación: 7.700 kcal ≈ 1 kg de grasa. La proteína se mantiene para cuidar tu músculo; se ajustan sobre todo los carbohidratos.</p>`;
    onValid&&onValid(true);
  };
  const draw=()=>{
    el.innerHTML=`<div class="opts">
      ${opt('recomendado','✨','Recomendado para tu enfoque',`${fmt(rec)} kcal al día`)}
      ${opt('ritmo','🐢','Elegir mi ritmo','Cuántos kg por semana quieres perder')}
      ${a.modo==='ritmo'?`<div class="optc two">${RIT.map(([v,t])=>`<button class="tag ${a.ritmo==v?'on':''}" data-rit="${v}" style="border-radius:12px;line-height:1.3">${t} · ${String(v).replace('.',',')} kg<br><small style="font-weight:500">${fmt(kRit(v))} kcal/día</small></button>`).join('')}</div>`:''}
      ${opt('fecha','📅','Llegar a un peso en una fecha','Por ejemplo, para tus vacaciones')}
      ${a.modo==='fecha'?`<div class="grid2"><label class="f" style="margin-top:0"><span>Peso objetivo (kg)</span><input class="in" type="number" step="0.1" inputmode="decimal" data-aj="pesoObj" value="${esc(a.pesoObj??'')}" placeholder="Ej. 62"></label><label class="f" style="margin-top:0"><span>Fecha</span><input class="in" type="date" data-aj="fechaObj" min="${addDays(today(),7)}" value="${esc(a.fechaObj||'')}"></label></div>`:''}
      ${opt('fijo','🎯','Calorías exactas','Tú decides el número, por ejemplo 1.500')}
      ${a.modo==='fijo'?`<label class="f" style="margin-top:0"><span>Calorías al día${pf.enfoque==6?' (media de la semana)':''}</span><input class="in" type="number" inputmode="numeric" data-aj="kcal" value="${esc(a.kcal??'')}" placeholder="Ej. 1500"></label>`:''}
    </div><div id="ajprev"></div>`;
    el.querySelectorAll('[data-am2]').forEach(b=>b.onclick=()=>{a.modo=b.dataset.am2;
      if(a.modo==='ritmo'&&!a.ritmo)a.ritmo=0.5;if(a.modo==='fecha'&&!a.fechaObj&&pf.meta&&pf.meta>=addDays(today(),7))a.fechaObj=pf.meta;draw()});
    el.querySelectorAll('[data-rit]').forEach(b=>b.onclick=()=>{a.ritmo=+b.dataset.rit;draw()});
    el.querySelectorAll('[data-aj]').forEach(i=>i.oninput=()=>{a[i.dataset.aj]=i.type==='date'?i.value:(i.value===''?'':Number(i.value));prev()});
    prev();
  };
  draw();
}

const OFF_FIELDS='code,product_name,product_name_es,brands,quantity,nutriments';
function offMap(p){
  const n=p.nutriments||{};
  let k=n['energy-kcal_100g'];
  if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
  if(k==null)return null;
  const name=(p.product_name_es||p.product_name||'').trim();
  if(!name)return null;
  const r1=x=>Math.round((Number(x)||0)*10)/10;
  return {id:'o'+p.code,code:p.code,n:name+(p.brands?' · '+p.brands.split(',')[0].trim():''),k:Math.round(k),p:r1(n.proteins_100g),c:r1(n.carbohydrates_100g),g:r1(n.fat_100g),src:'off'};
}

const OFF_OFFLINE=IN_PREVIEW?'No se puede conectar con Open Food Facts desde esta vista previa. Úsalo en tu web: https://ninnx3.github.io/VUELVE/':'No se pudo conectar con Open Food Facts. Revisa tu conexión y vuelve a intentarlo en unos segundos.';
async function offFetch(url){
  let r;
  try{r=await fetch(url,{headers:{'Accept':'application/json'}})}catch(e){throw new Error(OFF_OFFLINE)}
  if(r.status===429)throw new Error('Open Food Facts limita las búsquedas por minuto. Espera unos segundos y vuelve a intentarlo.');
  if(!r.ok)throw new Error('Open Food Facts no responde ahora mismo ('+r.status+').');
  return r.json();
}
const OFF_CACHE={};
async function offSearch(q){
  const key=q.toLowerCase().trim();if(OFF_CACHE[key])return OFF_CACHE[key];
  let out=[],err=null;
  // 1) Buscador moderno de Open Food Facts (Search-a-licious), limitado a productos vendidos en España
  try{
    const u='https://search.openfoodfacts.org/search?page_size=30&langs=es&fields='+OFF_FIELDS+'&q='+encodeURIComponent(q+' countries_tags:"en:spain"');
    const j=await offFetch(u);out=(j.hits||j.products||[]).map(offMap).filter(Boolean);
  }catch(e){err=e}
  // 2) Buscador clásico como respaldo
  if(!out.length){
    try{
      const u='https://world.openfoodfacts.org/cgi/search.pl?action=process&json=1&search_simple=1&page_size=30'
        +'&tagtype_0=countries&tag_contains_0=contains&tag_0=spain&sort_by=unique_scans_n'
        +'&fields='+OFF_FIELDS+'&search_terms='+encodeURIComponent(q);
      const j=await offFetch(u);out=(j.products||[]).map(offMap).filter(Boolean);err=null;
    }catch(e){if(!err)err=e}
  }
  if(!out.length&&err)throw err;
  const seen=new Set();out=out.filter(f=>!seen.has(f.id)&&seen.add(f.id));
  OFF_CACHE[key]=out;return out;
}
async function offBarcode(code){
  const j=await offFetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields='+OFF_FIELDS);
  if(j.status!==1||!j.product)return null;
  return offMap({...j.product,code});
}
function rememberOff(u,f){

function renderAuth(mode='registro',prefill=''){
  SCREEN.busy=false;
  $('#root').innerHTML=`
  <div class="auth">
    <div class="art">
      <div class="bubble" style="width:340px;height:340px;background:#fff;top:-80px;right:-60px"></div>
      <div class="bubble" style="width:200px;height:200px;background:#f6d9e3;top:180px;left:-50px"></div>
      <div class="bubble" style="width:120px;height:120px;background:#d9cbee;top:90px;left:160px"></div>
      <blockquote>Vuelve por encima de <span>perfección.</span><br><span style="font-size:16px;letter-spacing:0;font-weight:500;color:var(--muted)">Cada registro cuenta.</span></blockquote>
    </div>
    <div class="box">
      <div class="logo">${LOGO}<div><b>VUELVE</b><small>Un día a la vez</small></div></div>
      <p class="eyebrow" style="margin-top:36px">${mode==='registro'?'Empieza hoy':'Bienvenida de nuevo'}</p>
      <h1 class="h1" style="margin-top:8px">${mode==='registro'?'Crea tu <span>cuenta.</span>':'Hola <span>otra vez.</span>'}</h1>
      <div class="seg"><button data-m="registro" class="${mode==='registro'?'on':''}">Crear cuenta</button><button data-m="login" class="${mode==='login'?'on':''}">Iniciar sesión</button></div>
      <form id="af">
        ${mode==='registro'?`<label class="f"><span>Nombre</span><input class="in" name="nombre" required autocomplete="given-name" placeholder="¿Cómo te llamas?"></label>`:''}
        <label class="f"><span>Email</span><input class="in" type="email" name="email" required autocomplete="email" placeholder="tu@email.com" value="${esc(prefill)}"></label>
        <label class="f"><span>Contraseña</span><input class="in" type="password" name="pass" required minlength="4" autocomplete="${mode==='registro'?'new-password':'current-password'}" placeholder="Mínimo 4 caracteres"></label>
        <div class="err" id="aerr"></div>
        <button class="btn block" style="margin-top:4px">${mode==='registro'?'Crear cuenta y empezar →':'Entrar →'}</button>
      </form>
      <div class="note">🧪 <b>Modo prueba.</b> Puedes crear tantas cuentas falsas como quieras. <span id="authsync">${CLOUD.db?'Se guardan en la nube, ligadas a tu sesión de Claude.':'Se guardan en este navegador.'}</span></div>
    </div>
  </div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>renderAuth(b.dataset.m));
  $('#af').onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),pass=f.get('pass');
    const d=load(),err=$('#aerr');
    if(mode==='registro'){
      if(d.users[email]){err.textContent='Ya existe una cuenta con ese email. Inicia sesión.';return}
      d.users[email]={email,nombre:f.get('nombre').trim(),pass:await hash(pass),creada:today(),profile:null,logs:{},weights:[],favs:[],custom:[],off:[]};
      d.session=email;save();route();
    }else{
      const u=d.users[email];
      if(!u||u.pass!==await hash(pass)){err.textContent='Email o contraseña incorrectos.';return}
      d.session=email;save();route();
    }
  };
}

let OB=null;
function startOnboarding(editing=false){
  const u=me();
  SCREEN.busy=true;
  OB={step:editing?1:0,editing,d:Object.assign({sexo:null,edad:'',altura:'',peso:'',grasa:'',actividad:null,enfoque:null,dias:[1,3,5],meta:'',metaNombre:''},JSON.parse(JSON.stringify(u.profile||{})))};
  if(OB.d.grasa==null)OB.d.grasa='';
  renderOB();
}
const STEPS=['bienvenida','sexo','cuerpo','grasa','actividad','enfoque','dias','meta','ritmo'];
const okCuerpo=d=>d.edad>=14&&d.edad<=100&&d.altura>=120&&d.altura<=230&&d.peso>=30&&d.peso<=300;
const okGrasa=d=>d.grasa===''||(d.grasa>=3&&d.grasa<=70);
function renderOB(){
  const u=me(),s=STEPS[OB.step],d=OB.d,tot=STEPS.length;
  let body='',ok=true;
  if(s==='bienvenida'){
    body=`<p class="eyebrow">Hola, ${esc(u.nombre)}</p><h2 class="h1" style="margin-top:10px">Vamos a calcular <span>tus números.</span></h2>
    <p class="lead">Unas preguntas rápidas sobre tu cuerpo, tu actividad y lo que quieres conseguir. Con eso calculamos tus calorías y macronutrientes exactos.</p>
    <div class="card"><div class="row"><div class="opt" style="border:0;padding:0;background:none"><span class="ic">⏱️</span><div><b>Menos de 2 minutos</b><small>Puedes cambiar tus datos cuando quieras desde Mi Espacio.</small></div></div></div></div>
    <div class="card" style="margin-top:10px"><div class="opt" style="border:0;padding:0;background:none"><span class="ic">🌿</span><div><b>Sin juicios</b><small>Son solo tu punto de partida. Vuelve por encima de perfección.</small></div></div></div>`;
  }
  if(s==='sexo'){
    body=`<p class="eyebrow">Paso 1 de 8</p><h2 class="h2" style="margin-top:10px">¿Cuál es tu <span>sexo biológico?</span></h2><p class="lead">Lo usamos en la fórmula del metabolismo basal (Mifflin-St Jeor).</p>
    <div class="opts">${['Mujer','Hombre'].map(x=>`<button class="opt ${d.sexo===x?'on':''}" data-k="sexo" data-v="${x}"><span class="ic">${x==='Mujer'?'♀':'♂'}</span><div><b>${x}</b></div></button>`).join('')}</div>`;
    ok=!!d.sexo;
  }
  if(s==='cuerpo'){
    body=`<p class="eyebrow">Paso 2 de 8</p><h2 class="h2" style="margin-top:10px">Cuéntame sobre <span>tu cuerpo.</span></h2><p class="lead">Datos de hoy, sin juzgar.</p>
    <label class="f"><span>Edad (años)</span><input class="in" type="number" inputmode="numeric" min="14" max="100" data-k="edad" value="${esc(d.edad)}" placeholder="Ej. 34"></label>
    <label class="f"><span>Altura (cm)</span><input class="in" type="number" inputmode="numeric" min="120" max="230" data-k="altura" value="${esc(d.altura)}" placeholder="Ej. 165"></label>
    <label class="f"><span>Peso actual (kg)</span><input class="in" type="number" inputmode="decimal" step="0.1" min="30" max="300" data-k="peso" value="${esc(d.peso)}" placeholder="Ej. 68,5"></label>`;
    ok=okCuerpo(d);
  }
  if(s==='grasa'){
    const imc=d.peso/Math.pow(d.altura/100,2),est=estimarGrasa(imc,+d.edad,d.sexo);
    body=`<p class="eyebrow">Paso 3 de 8 · Opcional</p><h2 class="h2" style="margin-top:10px">¿Conoces tu <span>% de grasa?</span></h2>
    <p class="lead">Si te has medido con báscula de bioimpedancia, DEXA o pliegues, ponlo aquí. Si no, lo estimamos con tu IMC.</p>
    <label class="f"><span>% de grasa corporal</span><input class="in" type="number" inputmode="decimal" step="0.1" min="3" max="70" data-k="grasa" value="${esc(d.grasa)}" placeholder="Déjalo vacío si no lo sabes"></label>
    <div class="grid2" style="margin-top:14px"><div class="tile"><div class="lbl">Tu IMC</div><div class="big">${fmt1(imc)}</div></div><div class="tile"><div class="lbl">Grasa estimada</div><div class="big">${fmt1(est)}<small> %</small></div></div></div>
    <p class="small muted" style="margin-top:10px">Estimación de Deurenberg. Una medición real siempre es más precisa.</p>`;
    ok=okGrasa(d);
  }
  if(s==='actividad'){
    body=`<p class="eyebrow">Paso 4 de 8</p><h2 class="h2" style="margin-top:10px">¿Cómo de activa es <span>tu semana?</span></h2><p class="lead">Piensa en una semana normal, con trabajo y ejercicio.</p>
    <div class="opts">${ACT.map(a=>`<button class="opt ${d.actividad==a.v?'on':''}" data-k="actividad" data-v="${a.v}"><span class="ic">${a.ic}</span><div><b>${a.t}</b><small>${a.s}</small></div></button>`).join('')}</div>`;
    ok=!!d.actividad;
  }
  if(s==='enfoque'){
    body=`<p class="eyebrow">Paso 5 de 8</p><h2 class="h2" style="margin-top:10px">¿Qué quieres <span>conseguir?</span></h2><p class="lead">Elige el enfoque que mejor encaje contigo ahora mismo.</p>
    <div class="opts">${Object.entries(ENFOQUES).map(([k,e])=>`<button class="opt ${d.enfoque==k?'on':''}" data-k="enfoque" data-v="${k}"><span class="ic">${e.ic}</span><div><b>${e.t}</b><small>${e.s}</small></div></button>`).join('')}</div>`;
    ok=!!d.enfoque;
  }
  if(s==='dias'){
    body=`<p class="eyebrow">Paso 6 de 8</p><h2 class="h2" style="margin-top:10px">¿Qué días <span>entrenas?</span></h2>
    <p class="lead">${d.enfoque==6?'Tu enfoque cicla nutrientes: los días de entreno tendrás más carbohidratos y los de descanso más grasa y menos calorías.':'Lo usamos para tu objetivo semanal de movimiento.'}</p>
    <div class="chips">${[1,2,3,4,5,6,0].map(i=>`<button class="chip ${d.dias.includes(i)?'on':''}" data-day="${i}">${DOW[i]}</button>`).join('')}</div>
    <p class="small muted" style="margin-top:12px">${d.dias.length} día${d.dias.length===1?'':'s'} por semana</p>`;
  }
  if(s==='ritmo'){
    body=`<p class="eyebrow">Paso 8 de 8</p><h2 class="h2" style="margin-top:10px">¿A qué ritmo <span>quieres ir?</span></h2>
    <p class="lead">Tu enfoque decide cómo se reparten los macros. Aquí eliges cuántas calorías comer: lo recomendado, un ritmo concreto, una fecha o un número exacto.</p><div id="ajw" style="margin-top:6px"></div>`;
  }
  if(s==='meta'){
    body=`<p class="eyebrow">Paso 7 de 8 · Opcional</p><h2 class="h2" style="margin-top:10px">¿Tienes una <span>fecha en mente?</span></h2><p class="lead">Un viaje, un evento, un cumpleaños… Te mostraremos una cuenta atrás.</p>
    <label class="f"><span>Fecha objetivo</span><input class="in" type="date" data-k="meta" value="${esc(d.meta)}" min="${today()}"></label>
    <label class="f"><span>Nombre de la meta</span><input class="in" data-k="metaNombre" value="${esc(d.metaNombre||'')}" placeholder="Ej. Vacaciones de verano"></label>`;
  }
  $('#root').innerHTML=`<div class="ob">
    <div class="ob-top"><div class="row between"><div class="logo">${LOGO}<div><b>VUELVE</b><small>Tu punto de partida</small></div></div>
      ${OB.editing?'<button class="btn ghost" id="obx">Cancelar</button>':`<span class="small muted" style="font-weight:600">${OB.step+1} / ${tot}</span>`}</div>
      <div class="pbar"><i style="width:${(OB.step+1)/tot*100}%"></i></div></div>
    <div style="margin-top:10px">${body}</div>
  </div>
  <div class="ob-nav"><div class="in2">
    ${OB.step>(OB.editing?1:0)?'<button class="btn soft" id="obb">←</button>':''}
    <button class="btn block" id="obn" ${ok?'':'disabled'}>${OB.step===tot-1?'Calcular mi plan ✓':OB.step===0?'Empezar →':'Siguiente →'}</button>
  </div></div>`;
  $$('[data-k][data-v]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;d[k]=k==='sexo'?b.dataset.v:Number(b.dataset.v);renderOB()});
  if(s==='ritmo')ajusteEditor($('#ajw'),d,v=>{$('#obn').disabled=!v});
  $$('input[data-k]').forEach(i=>i.oninput=()=>{const k=i.dataset.k;d[k]=(i.type==='number')?(i.value===''?'':Number(i.value)):i.value;
    const s=STEPS[OB.step];if(s==='cuerpo')$('#obn').disabled=!okCuerpo(d);if(s==='grasa')$('#obn').disabled=!okGrasa(d)});
  $$('[data-day]').forEach(b=>b.onclick=()=>{const i=+b.dataset.day;d.dias=d.dias.includes(i)?d.dias.filter(x=>x!==i):[...d.dias,i];renderOB()});
  if($('#obb'))$('#obb').onclick=()=>{OB.step--;renderOB();scrollTo(0,0)};
  if($('#obx'))$('#obx').onclick=()=>{SCREEN.busy=false;renderApp()};
  $('#obn').onclick=()=>{
    if(OB.step<tot-1){OB.step++;renderOB();scrollTo(0,0);return}
    const u=me(),first=!u.profile;
    u.profile={...d,grasa:d.grasa===''?null:d.grasa};
    if(first||!u.weights.length)upsertWeight(u,today(),Number(d.peso));
    save();renderResult();
  };
}
function upsertWeight(u,date,kg){
  const w=u.weights.find(x=>x.date===date);
  if(w)w.kg=kg;else u.weights.push({date,kg});
  u.weights.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- Plan ---------- */
function planCard(m,titulo){
  const pc=R(m.p*4/m.kcal*100),cc=R(m.c*4/m.kcal*100),gc=R(m.g*9/m.kcal*100);
  return `<div class="plan">${titulo?`<p class="eyebrow" style="margin-bottom:8px">${titulo}</p>`:''}
    <div class="kc">${fmt(m.kcal)}<small> kcal / día</small></div>
    <div class="mm">
      <div><b style="color:var(--p)">${m.p}g</b><small>Proteínas<br>${fmt(m.p*4)} kcal · ${pc}%</small></div>
      <div><b style="color:var(--c)">${m.c}g</b><small>Carbohidratos<br>${fmt(m.c*4)} kcal · ${cc}%</small></div>
      <div><b style="color:var(--g)">${m.g}g</b><small>Grasas<br>${fmt(m.g*9)} kcal · ${gc}%</small></div>
    </div>
    ${m.carbNeg?'<p class="small" style="color:var(--warn);margin-top:10px">⚠️ Con estos datos, proteína y grasa ya superan las calorías objetivo; los carbohidratos se han fijado en 0 g. Revisa tus datos.</p>':''}
  </div>`;
}
function calcTable(r,pf){
  return `<table class="calc">
    <tr><td>IMC</td><td>${fmt1(r.imc)}</td></tr>
    <tr><td>% grasa (${r.grasaFuente})</td><td>${fmt1(r.grasa)} %</td></tr>
    <tr><td>Base para los gramos</td><td><span class="pill ${r.estado==='Obesidad'?'warn':'ok'}">${r.estado==='Obesidad'?'Peso ajustado':'Peso real'}</span></td></tr>

function dayLog(u,date){const l=u.logs[date]||(u.logs[date]={foods:[],mov:[],tipo:null});l.foods=l.foods||[];l.mov=l.mov||[];return l}
function peekLog(u,date){return u.logs[date]||{foods:[],mov:[],tipo:null}}
function isTrainDay(u,date){
  const l=u.logs[date];
  if(l&&l.tipo)return l.tipo==='entreno';
  if(l&&l.mov&&l.mov.length)return true;
  return u.profile.dias.includes(parse(date).getDay());
}
function targetFor(u,date){
  const r=calcular(u.profile);
  if(r.plan.normal)return r.plan.normal;
  return isTrainDay(u,date)?r.plan.entreno:r.plan.descanso;
}
function totals(foods){return (foods||[]).reduce((a,f)=>({k:a.k+f.k,p:a.p+f.p,c:a.c+f.c,g:a.g+f.g}),{k:0,p:0,c:0,g:0})}
const MET={Suave:3.5,Media:5.5,Alta:8};
function exKcal(u,mov){const kg=+u.profile.peso;return (mov||[]).reduce((a,m)=>a+(m.kcal!=null?m.kcal:MET[m.int||'Media']*kg*m.min/60),0)}

function retoFin(r){return addDays(r.inicio,r.dias-1)}

function retoScore(r,email){
  const u=load().users[email];if(!u||!u.profile)return {pts:0,kcal:0,mov:0};
  let kcal=0,mov=0;const end=retoFin(r)<today()?retoFin(r):today();

        <button class="way" data-mode="buscar"><span class="ic" style="background:var(--lilac)">🔍</span><div><b>Buscar alimento</b><small>Productos de supermercados de España (Open Food Facts), básicos y favoritos.</small></div></button>
        <button class="way" data-mode="codigo"><span class="ic" style="background:var(--mint)">▦</span><div><b>Escanear código</b><small>Con la cámara o escribiendo las cifras.</small></div></button>
      </div>`;
      bindPick();
      mb.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});
      return;
    }
    if(mode==='buscar'){
      const all=[...u.custom,...(u.off||[]),...FOODS];
      const recentIds=[...new Set(Object.keys(u.logs).sort().reverse().flatMap(d=>(u.logs[d].foods||[]).map(f=>f.fid)).filter(Boolean))];
      let list=sub==='fav'?all.filter(f=>u.favs.includes(f.id)):sub==='rec'?recentIds.map(id=>all.find(f=>f.id===id)).filter(Boolean):all;
      if(q)list=list.filter(f=>norm(f.n).includes(q));
      mb.innerHTML=`${back}${pickHTML()}
        <div class="subseg">${[['todos','Todos los alimentos'],['rec','Recientes'],['fav','★ Favoritos']].map(([k,t])=>`<button data-sub="${k}" class="${sub===k?'on':''}">${t}</button>`).join('')}</div>
        <div class="searchrow"><input class="in" id="q" placeholder="Ej. huevo, yogur Hacendado…" value="${esc(qRaw)}"><button class="btn" id="offgo2" style="padding:10px 14px;font-size:12px">Buscar</button></div>
        <div class="results">
          <p class="h3" style="font-size:13px">Resultados</p><p class="tiny muted" style="margin-bottom:8px">Valores por 100 g · al elegir indicas la cantidad</p>
          ${list.length?list.slice(0,80).map(row).join(''):`<p class="small muted" style="padding:6px 0 10px">${sub==='fav'?'Aún no tienes favoritos. Toca ★ en un alimento.':sub==='rec'?'Aún no hay recientes.':'Nada en tu lista. Pulsa Buscar para mirar en supermercados de España.'}</p>`}
          ${sub==='todos'&&qRaw.trim().length>=2?`<p class="eyebrow" style="margin:12px 0 8px">Supermercados de España · Open Food Facts</p>
            ${offLoading?'<p class="small muted">Buscando…</p>':offErr?`<p class="small" style="color:var(--warn)">${esc(offErr)}</p>`:offRes?(offRes.length?offRes.map(row).join(''):'<p class="small muted">Sin resultados en Open Food Facts.</p>'):'<p class="small muted">Pulsa <b>Buscar</b> para consultar Open Food Facts.</p>'}`:''}
        </div>
        <p class="notfound">No lo encuentro · <a href="#" id="toown">introducir etiqueta propia →</a></p>${OFF_NOTE}`;
      bindPick();
      const pool=()=>[...all,...(offRes||[])];
      const drawK=()=>{const had=document.activeElement&&document.activeElement.id==='q';draw();const n=m.querySelector('#q');if(had&&n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
      const runOff=async()=>{if(qRaw.trim().length<2){toast('Escribe al menos 2 letras');return}const qq=qRaw.trim();sub='todos';offLoading=true;offErr='';drawK();try{const res=await offSearch(qq);if(qq!==qRaw.trim())return;offRes=res}catch(e){if(qq!==qRaw.trim())return;offErr=e.message}offLoading=false;if(m.isConnected&&mode==='buscar')drawK()};
      const qi=mb.querySelector('#q');
      qi.oninput=()=>{qRaw=qi.value;q=norm(qi.value);offRes=null;offErr='';draw();const n=m.querySelector('#q');n.focus();n.setSelectionRange(n.value.length,n.value.length);
        clearTimeout(offT);if(qRaw.trim().length>=3&&!IN_PREVIEW)offT=setTimeout(()=>{if(m.isConnected&&mode==='buscar')runOff()},900)};
      qi.onkeydown=e=>{if(e.key==='Enter')runOff()};
      mb.querySelector('#offgo2').onclick=runOff;
      mb.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;draw()});
      mb.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.star;const of=(offRes||[]).find(x=>x.id===id);if(of)rememberOff(u,of);u.favs=u.favs.includes(id)?u.favs.filter(x=>x!==id):[...u.favs,id];save();draw()});
      mb.querySelectorAll('[data-f]').forEach(r=>r.onclick=()=>{const f=pool().find(f=>f.id===r.dataset.f);if(f.src==='off')rememberOff(u,f);qty(f)});
      mb.querySelector('#toown').onclick=e=>{e.preventDefault();mode='propio';draw()};
      mb.querySelector('#bk').onclick=()=>{mode='menu';draw()};
      return;
    }
    if(mode==='codigo'){
      mb.innerHTML=`${back}${pickHTML()}<p class="small muted" style="margin-top:14px">Escanea el código con la cámara o escribe las cifras que aparecen debajo de las barras.</p>
        <div class="searchrow"><input class="in" id="bc" inputmode="numeric" placeholder="Ej. 8480000160164"><button class="btn" id="bcs" style="padding:10px 14px;font-size:12px">Buscar</button></div>
        <button class="btn soft block" style="margin-top:10px" id="cam">📷 Escanear con la cámara</button>
        <video id="vid" playsinline muted style="width:100%;border-radius:12px;margin-top:12px;display:none;background:#000"></video>
        <div id="bcr" class="small" style="margin-top:10px"></div>${OFF_NOTE}`;
      bindPick();
      mb.querySelector('#bk').onclick=()=>{mode='menu';draw()};
      const out=mb.querySelector('#bcr');
      const look=async code=>{
        code=String(code).replace(/\D/g,'');if(code.length<6){out.innerHTML='<span style="color:var(--warn)">Código no válido.</span>';return}
        stopScan();mb.querySelector('#vid').style.display='none';
        out.textContent='Buscando '+code+'…';
        try{const f=await offBarcode(code);
          if(!f){out.innerHTML=`No encontramos ese producto (o no tiene calorías). <a href="#" id="toown2">Introducir etiqueta propia →</a>`;out.querySelector('#toown2').onclick=e=>{e.preventDefault();mode='propio';draw()};return}
          rememberOff(u,f);qty(f);
        }catch(e){out.innerHTML='<span style="color:var(--warn)">'+esc(e.message)+'</span>'}
      };
      mb.querySelector('#bcs').onclick=()=>look(mb.querySelector('#bc').value);
      mb.querySelector('#bc').onkeydown=e=>{if(e.key==='Enter')look(e.target.value)};
      mb.querySelector('#cam').onclick=async()=>{
        const v=mb.querySelector('#vid');
        if(!navigator.mediaDevices?.getUserMedia){out.innerHTML='<span style="color:var(--warn)">Este navegador no permite usar la cámara aquí. Escribe el código a mano.</span>';return}
        out.textContent='Abriendo cámara…';v.style.display='block';
        try{
          if('BarcodeDetector' in window){
            const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
            const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
            v.srcObject=st;await v.play();let on=true;
            scanCtl={stop(){on=false;st.getTracks().forEach(t=>t.stop())}};
            out.textContent='Apunta al código de barras…';
            const loop=async()=>{if(!on)return;try{const r=await det.detect(v);if(r.length){look(r[0].rawValue);return}}catch(e){}requestAnimationFrame(loop)};loop();
          }else{
            if(!window.ZXingBrowser)await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
            const rd=new ZXingBrowser.BrowserMultiFormatReader();
            out.textContent='Apunta al código de barras…';
            scanCtl=await rd.decodeFromVideoDevice(undefined,v,res=>{if(res)look(res.getText())});
          }
        }catch(e){v.style.display='none';out.innerHTML='<span style="color:var(--warn)">No se pudo abrir la cámara (permiso denegado o no disponible en esta vista previa). Escribe el código a mano.</span>'}
      };
      return;
    }
    if(mode==='manual'){
      mb.innerHTML=`${back}${pickHTML()}<p class="small muted" style="margin-top:14px">Calorías y macros opcionales, sin buscar.</p>
      <label class="f"><span>Descripción</span><input class="in" id="mn" placeholder="Ej. Menú del día"></label>
      <label class="f"><span>Calorías (kcal)</span><input class="in" id="mk" type="number" inputmode="numeric"></label>
      <div class="grid3"><label class="f"><span>Proteínas g</span><input class="in" id="mp" type="number" inputmode="decimal"></label><label class="f"><span>Carbos g</span><input class="in" id="mc" type="number" inputmode="decimal"></label><label class="f"><span>Grasas g</span><input class="in" id="mg" type="number" inputmode="decimal"></label></div>
      <button class="btn block" style="margin-top:18px" id="ms">Añadir a ${meal}</button>`;
      bindPick();
      mb.querySelector('#bk').onclick=()=>{mode='menu';draw()};
      mb.querySelector('#ms').onclick=()=>{const k=+mb.querySelector('#mk').value;if(!k){toast('Indica las calorías');return}
        add({n:mb.querySelector('#mn').value||'Entrada rápida',k,p:+mb.querySelector('#mp').value||0,c:+mb.querySelector('#mc').value||0,g:+mb.querySelector('#mg').value||0})};
      return;
    }
    if(mode==='propio'){
      mb.innerHTML=`${back}<p class="small muted" style="margin-top:14px">Copia los valores <b>por 100 g</b> de la etiqueta. Se guardará en tu lista para la próxima vez.</p>
      <label class="f"><span>Nombre del producto</span><input class="in" id="cn" placeholder="Ej. Yogur proteico marca X" value="${esc(qRaw)}"></label>
      <div class="grid2"><label class="f"><span>kcal / 100 g</span><input class="in" id="ck" type="number"></label><label class="f"><span>Proteínas / 100 g</span><input class="in" id="cp" type="number" step="0.1"></label>
      <label class="f"><span>Carbos / 100 g</span><input class="in" id="cc" type="number" step="0.1"></label><label class="f"><span>Grasas / 100 g</span><input class="in" id="cg" type="number" step="0.1"></label></div>
      <button class="btn block" style="margin-top:18px" id="cs">Guardar y elegir cantidad</button>`;
      mb.querySelector('#bk').onclick=()=>{mode='menu';draw()};
      mb.querySelector('#cs').onclick=()=>{const n=mb.querySelector('#cn').value.trim(),k=+mb.querySelector('#ck').value;if(!n||!k){toast('Nombre y kcal son obligatorios');return}
        const f={id:'u'+Date.now(),n,k,p:+mb.querySelector('#cp').value||0,c:+mb.querySelector('#cc').value||0,g:+mb.querySelector('#cg').value||0};
        u.custom.unshift(f);save();qty(f)};
    }
  };
  const qty=f=>{
    stopScan();
    const mb=m.querySelector('#mb');
    mb.innerHTML=`<button class="back" id="qb">← Volver</button>
      <div class="pv" style="background:#fff;border:1px solid var(--line)"><b>${esc(f.n)}</b><p class="small muted">${f.k} kcal por 100 g</p></div>
      ${pickHTML()}
      <label class="f"><span>Cantidad (g)</span><input class="in" id="qg" type="number" inputmode="decimal" value="100"></label>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">${[30,50,125,150,200].map(g=>`<button class="btn ghost" data-g="${g}">${g} g</button>`).join('')}</div>
      <div class="pv" id="qp"></div>
      <button class="btn block" style="margin-top:14px" id="qa">Añadir a ${meal}</button>`;
    m.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{meal=b.dataset.pm;m.querySelector('#mtitle').textContent=meal+' · '+u.nombre;m.querySelectorAll('[data-pm]').forEach(x=>x.classList.toggle('on',x===b));mb.querySelector('#qa').textContent='Añadir a '+meal});
    const calc=()=>{const g=+mb.querySelector('#qg').value||0,x=g/100;return{fid:f.id,n:f.n,q:g,k:f.k*x,p:f.p*x,c:f.c*x,g:f.g*x}};
    const upd=()=>{const c=calc();mb.querySelector('#qp').innerHTML=`<div class="row between"><b style="font-size:24px;font-weight:800;letter-spacing:-1px">${fmt(c.k)} kcal</b><span class="small">P ${fmt1(c.p)} · C ${fmt1(c.c)} · G ${fmt1(c.g)}</span></div>`};
    mb.querySelector('#qg').oninput=upd;
    mb.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{mb.querySelector('#qg').value=b.dataset.g;upd()});
    mb.querySelector('#qa').onclick=()=>add(calc());
    mb.querySelector('#qb').onclick=draw;
    upd();
  };
  const add=item=>{dayLog(u,UI.date).foods.push({...item,meal});save();m.remove();toast('Añadido a '+meal+' ✓');UI.showMeals=true;if(UI.view==='diario'){UI.range='dia';vDiario()}};
  draw();
}

  const pf=u.profile;
  const m=modal(`<div class="l" style="padding:0">${ILLU}</div><div class="r"><button class="close" style="position:absolute;top:16px;right:16px">✕</button>

/* ---------- Movimiento ---------- */
const TIPOS=['Gimnasio / fuerza','Caminar','Correr','Bici / spinning','Yoga / pilates','Clase dirigida','Otro'];
function vMov(){
  const u=me(),log=peekLog(u,UI.date),ws=weekStart(UI.date);
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const done=days.filter(d=>(u.logs[d]?.mov||[]).length).length,goal=u.profile.dias.length;
  $('#view').innerHTML=heroHTML('Movimiento','Mueve el','cuerpo.')+`
  <div class="datenav"><button class="ar" id="dp">←</button><div class="t"><b>${dateTitle(UI.date)}</b><small>${UI.date===today()?'Hoy':'Registro del día'}</small></div><button class="ar" id="dn">→</button></div>
  <div class="card"><div class="row between movwk"><div><p class="eyebrow">Esta semana</p><div style="font-size:30px;font-weight:800;letter-spacing:-1.2px;margin-top:4px">${done}<span style="font-weight:500;color:var(--accent)"> / ${goal} días</span></div></div>
    <div class="row" style="gap:5px">${days.map(d=>{const has=(u.logs[d]?.mov||[]).length,pl=u.profile.dias.includes(parse(d).getDay());return `<span style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;${has?'background:var(--plum);color:#fff':pl?'background:var(--lilac);color:var(--plum)':'background:var(--tile);color:var(--muted)'}">${DOW[parse(d).getDay()]}</span>`}).join('')}</div></div>
    <div class="minibar" style="margin-top:14px"><i style="width:${Math.min(done/goal*100||0,100)}%;background:var(--plum)"></i></div>
    <p class="tiny muted" style="margin-top:8px">Lila = días planificados · Morado = días con actividad</p></div>
  <div class="card"><p class="eyebrow">Registrar actividad</p>
    <label class="f"><span>Tipo</span><select class="in" id="mt">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select></label>
    <div class="grid2"><label class="f"><span>Minutos</span><input class="in" id="mm" type="number" inputmode="numeric" placeholder="45"></label>
    <label class="f"><span>Intensidad</span><select class="in" id="mi"><option>Suave</option><option selected>Media</option><option>Alta</option></select></label></div>
    <label class="f"><span>Notas</span><input class="in" id="mn" placeholder="Ej. Pierna + glúteo"></label>
    <button class="btn block" style="margin-top:16px" id="ma">Guardar actividad</button></div>
  <div class="card"><p class="eyebrow">Actividad del día · ${fmt(exKcal(u,log.mov))} kcal estimadas</p>
    ${log.mov.length?log.mov.map((x,i)=>`<div class="item"><div class="n"><b>${esc(x.t)}</b><small>${x.min} min · ${x.int}${x.n?' · '+esc(x.n):''}</small></div><span class="k">${fmt(exKcal(u,[x]))} kcal</span><button class="x" data-del="${i}">✕</button></div>`).join(''):'<p class="muted small" style="margin-top:8px">Aún no hay nada. ¡Hasta un paseo cuenta!</p>'}
  </div><p class="foot">Estimación con valores MET según intensidad y tu peso.</p>`;
  bindArrows(()=>UI.date=addDays(UI.date,-1),()=>UI.date=addDays(UI.date,1),vMov);
  $('#ma').onclick=()=>{const min=+$('#mm').value;if(!min){toast('Indica los minutos');return}
    dayLog(u,UI.date).mov.push({t:$('#mt').value,min,int:$('#mi').value,n:$('#mn').value});save();toast('Actividad guardada ✓');vMov()};
  $$('[data-del]').forEach(b=>b.onclick=()=>{dayLog(u,UI.date).mov.splice(+b.dataset.del,1);save();vMov()});
}

/* ---------- Progreso ---------- */
function vProgreso(){
  const u=me(),W=u.weights,pf=u.profile,MOB=innerWidth<=640,F1=MOB?20:11,F2=MOB?17:10;
  const first=W[0]?.kg,last=W[W.length-1]?.kg;
  let chart='<p class="muted small" style="margin-top:10px">Registra tu peso para ver la evolución.</p>';
  if(W.length){
    const w=600,h=200,px=40,py=20,vals=W.map(x=>x.kg),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
    const X=i=>W.length===1?w/2:px+i*(w-px*2)/(W.length-1),Y=v=>py+(mx-v)/(mx-mn)*(h-py*2);
    const pts=W.map((x,i)=>`${X(i)},${Y(x.kg)}`).join(' ');
    chart=`<svg class="chart" viewBox="0 0 ${w} ${h+20}">
      ${[0,.5,1].map(t=>{const v=mx-(mx-mn)*t;return `<line x1="${px}" x2="${w-px}" y1="${Y(v)}" y2="${Y(v)}" stroke="#efe9ee"/><text x="0" y="${Y(v)+4}" font-size="${F1}" fill="#7d6c7a" font-family="Montserrat">${fmt1(v)}</text>`}).join('')}
      <polyline points="${pts}" fill="none" stroke="#744a69" stroke-width="2.5" stroke-linejoin="round"/>
      ${W.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.kg)}" r="4.5" fill="#fff" stroke="#744a69" stroke-width="2"><title>${x.date}: ${x.kg} kg</title></circle>`).join('')}
      ${W.length>1?[0,W.length-1].map(i=>`<text x="${X(i)}" y="${h+14}" font-size="${F1}" fill="#7d6c7a" font-family="Montserrat" text-anchor="${i?'end':'start'}">${parse(W[i].date).getDate()} ${MON[parse(W[i].date).getMonth()]}</text>`).join(''):''}
    </svg>`;
  }
  const ws0=weekStart(today()),weeks=[...Array(8)].map((_,i)=>addDays(ws0,-7*(7-i)));
  const data=weeks.map(ws=>{let ok=0,gym=0;for(let i=0;i<7;i++){const d=addDays(ws,i);if(dayStatus(u,d)==='ok')ok++;if((u.logs[d]?.mov||[]).length)gym++}return{ws,ok,gym}});
  const bw=600,bh=170,slot=(bw-30)/8,goal=pf.dias.length;
  const bars=`<svg class="chart" viewBox="0 0 ${bw} ${bh+22}">
    ${[0,7].map(v=>`<line x1="24" x2="${bw}" y1="${bh-v/7*(bh-10)}" y2="${bh-v/7*(bh-10)}" stroke="#efe9ee"/><text x="0" y="${bh-v/7*(bh-10)+4}" font-size="${F1}" fill="#7d6c7a" font-family="Montserrat">${v}</text>`).join('')}
    <line x1="24" x2="${bw}" y1="${bh-goal/7*(bh-10)}" y2="${bh-goal/7*(bh-10)}" stroke="#a99bd0" stroke-dasharray="4 4"/>
    ${data.map((d,i)=>{const x=30+i*slot,bwid=slot*0.3;return `
      <rect x="${x+slot*0.14}" y="${bh-d.ok/7*(bh-10)}" width="${bwid}" height="${d.ok/7*(bh-10)}" rx="4" fill="#7aa898"><title>${d.ok} días cumplidos</title></rect>
      <rect x="${x+slot*0.14+bwid+3}" y="${bh-d.gym/7*(bh-10)}" width="${bwid}" height="${d.gym/7*(bh-10)}" rx="4" fill="#a99bd0"><title>${d.gym} días de movimiento</title></rect>
      <text x="${x+slot*0.45}" y="${bh+16}" font-size="${F2}" fill="#7d6c7a" font-family="Montserrat" text-anchor="middle">${i===7?(MOB?'hoy':'en curso'):parse(d.ws).getDate()+(MOB?'':' '+MON[parse(d.ws).getMonth()])}</text>`}).join('')}
  </svg>`;
  $('#view').innerHTML=heroHTML('Mi progreso','La constancia','también se ve.')+`
  <div class="grid3" style="margin-top:20px">
    <div class="stat"><b>${last!=null?fmt1(last):'—'}</b><small>kg actual</small></div>
    <div class="stat"><b>${W.length>1?((last-first)>0?'+':'')+fmt1(last-first):'—'}</b><small>kg cambio</small></div>
    <div class="stat"><b>${Object.values(u.logs).filter(l=>(l.foods||[]).length).length}</b><small>días registrados</small></div>
  </div>
  <div class="card"><div class="row between"><p class="eyebrow">Evolución del peso</p><button class="btn sm" id="ci">+ Check-in</button></div>${chart}</div>
  <div class="card"><p class="eyebrow">Últimas 8 semanas · lunes a domingo</p>${bars}

/* =========================================================
   MENÚ · CREAR MEALPREP (IA)
   ========================================================= */
const MP={screen:'home',step:0,prefs:null,ctl:null,err:'',progress:''};
const DIAS7=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const GUSTOS=['Mediterránea','Casera española','Italiana','Asiática','Mexicana','Árabe / Libanesa','Vegetariana','Vegana','Alta en proteína','Rápida (<20 min)','Sin horno','Bowls y ensaladas','Cuchara y guisos','Dulce para desayunar'];
const INCLUIR=['Huevos','Avena','Yogur','Pollo','Pavo','Salmón','Atún','Legumbres','Arroz','Patata / boniato','Aguacate','Fruta','Verduras de hoja','Frutos secos','Queso fresco'];
const EVITAR=['Lactosa','Gluten','Frutos secos','Marisco','Pescado','Cerdo','Carne roja','Huevo','Picante','Champiñones','Cebolla cruda'];
const CHEATS=['Chocolate','Pizza','Hamburguesa','Helado','Tarta de queso','Croissant','Patatas fritas','Tortitas con sirope','Galletas','Nachos','Sushi','Brownie'];
function mpDefaults(u){return {gustos:[],gustosTxt:'',incluir:[],incluirTxt:'',evitar:[],evitarTxt:'',comidas:['Desayuno','Comida','Cena','Snack'],cheatDias:[5],cheatFav:[],cheatTxt:'',sesiones:2,tiempo:'normal'}}
function mpTargets(u){
  const ws=weekStart(today());
  return DIAS7.map((n,i)=>{const date=addDays(ws,i),t=targetFor(u,date),r=calcular(u.profile);
    return {dia:n,date,tipo:r.plan.normal?null:(isTrainDay(u,date)?'entreno':'descanso'),kcal:t.kcal,p:t.p,c:t.c,g:t.g}});
}
function mpPrompt(u,pr){
  const pf=u.profile,T=mpTargets(u),cheatN=pr.cheatDias.length,mode=cheatN===0?'ninguno':cheatN>=5?'capricho':'cheatmeal';
  const join=(a,t)=>[...a,...(t?[t]:[])].join(', ')||'sin preferencia';
  return `Eres nutricionista y chef. Diseña un MEALPREP semanal (lunes a domingo) en español de España para esta persona, con recetas reales, sabrosas y fáciles de preparar en lote.

PERSONA
- Sexo ${pf.sexo}, ${pf.edad} años, ${pf.peso} kg, ${pf.altura} cm. Objetivo: ${ENFOQUES[pf.enfoque].t} (${ENFOQUES[pf.enfoque].s}).
- Comidas a diseñar cada día: ${pr.comidas.join(', ')}.
- Gustos / estilos: ${join(pr.gustos,pr.gustosTxt)}.
- Incluir siempre o con frecuencia: ${join(pr.incluir,pr.incluirTxt)}.
- EVITAR por completo (alergias/intolerancias/no le gusta): ${join(pr.evitar,pr.evitarTxt)}.
- Cocina en ${pr.sesiones} sesión(es) de batch cooking a la semana. Tiempo disponible: ${pr.tiempo==='rapido'?'poco, recetas muy rápidas':pr.tiempo==='mucho'?'le gusta cocinar, puede ser más elaborado':'normal'}.
- Cheatmeal / capricho favorito: ${join(pr.cheatFav,pr.cheatTxt)}.

OBJETIVO DIARIO (calorías y gramos que la suma de TODO lo del día debe cumplir):
${T.map(t=>`- ${t.dia}${t.tipo?` (${t.tipo})`:''}: ${t.kcal} kcal · P ${t.p} g · C ${t.c} g · G ${t.g} g`).join('\n')}

CHEAT DAYS: ${cheatN===0?'ninguno.':pr.cheatDias.map(i=>DIAS7[(i+6)%7]).join(', ')+'.'}
${mode==='cheatmeal'?'- En cada cheat day, SUSTITUYE una de sus comidas (normalmente la cena o la comida) por una versión de su cheatmeal favorito, presentada como algo apetecible de verdad, y marca esa receta con "cheat": true. Ajusta el resto de comidas de ese día (más ligeras y proteicas) para que el total del día siga dentro de sus calorías y macros.':''}
${mode==='capricho'?'- Ha elegido muchos días: en cada cheat day añade un CAPRICHO pequeño (100–250 kcal) basado en su dulce/cheat favorito (p. ej. 20–30 g de chocolate negro), en el campo "capricho" del día, con "cheat": true en la receta. El resto del día se ajusta para que el total siga dentro de sus calorías y macros.':''}

REGLAS
1. Es mealprep: usa POCAS recetas que se repiten (2–3 recetas distintas por tipo de comida en la semana), pensadas para cocinarse en lote. Cada receta tiene macros POR RACIÓN (1 ración = lo que come esa persona en esa comida).
2. Para cada día, la suma de kcal de sus comidas (+ capricho si hay) debe quedar a ±5% del objetivo de ese día, y la proteína al menos el 95% del objetivo. Cuadra los números con cantidades realistas en gramos.
3. Calcula macros con valores nutricionales reales; kcal ≈ 4·P + 4·C + 9·G.
4. Ingredientes con cantidades en gramos o unidades por ración. Pasos breves y claros (3–7). Un emoji que represente el plato.
5. Lista de la compra para toda la semana agrupada por sección del supermercado, con cantidades totales.

RESPONDE SOLO con JSON válido con esta forma exacta (sin texto adicional):
{"recetas":[{"id":"r1","tipo":"Desayuno|Comida|Cena|Snack|Capricho","nombre":"","emoji":"🍳","descripcion":"una frase apetecible","kcal":0,"p":0,"c":0,"g":0,"prep_min":0,"coccion_min":0,"raciones_lote":0,"ingredientes":[{"item":"","cantidad":""}],"pasos":[""],"conservacion":"","consejo":"","cheat":false}],
"semana":[{"dia":"Lunes","comidas":{${pr.comidas.map(c=>`"${c}":"r1"`).join(',')}},"capricho":null}],
"lista_compra":[{"seccion":"Frutería","items":["Plátanos · 7 uds"]}],
"notas":"2–3 frases con consejos de batch cooking para esta semana"}
"semana" debe tener exactamente 7 elementos (Lunes a Domingo) y cada comida debe referenciar un id existente en "recetas".`;
}
function mpValidate(plan,pr){
  if(!plan||!Array.isArray(plan.recetas)||!Array.isArray(plan.semana))throw new Error('formato');
  const ids=new Set(plan.recetas.map(r=>r.id));
  plan.recetas.forEach(r=>{['kcal','p','c','g','prep_min','coccion_min'].forEach(k=>r[k]=Math.round(Number(r[k])||0));r.ingredientes=r.ingredientes||[];r.pasos=r.pasos||[];r.emoji=r.emoji||'🍽️'});
  plan.semana=DIAS7.map((n,i)=>{const s=plan.semana.find(x=>(x.dia||'').toLowerCase()===n.toLowerCase())||plan.semana[i]||{comidas:{}};
    const c={};for(const k of pr.comidas)if(ids.has(s.comidas?.[k]))c[k]=s.comidas[k];
    return {dia:n,comidas:c,capricho:ids.has(s.capricho)?s.capricho:null}});
  plan.lista_compra=Array.isArray(plan.lista_compra)?plan.lista_compra:[];
  return plan;
}
function mpDayTotal(plan,s){
  const R_=id=>plan.recetas.find(r=>r.id===id);
  const items=[...Object.values(s.comidas),...(s.capricho?[s.capricho]:[])].map(R_).filter(Boolean);
  return items.reduce((a,r)=>({k:a.k+r.kcal,p:a.p+r.p,c:a.c+r.c,g:a.g+r.g}),{k:0,p:0,c:0,g:0});
}
