    <div></div>
    ${plan.semana.map((s,i)=>{const t=mpDayTotal(plan,s),tg=T[i],ok=Math.abs(t.k-tg.kcal)<=tg.kcal*0.05,date=addDays(ws,i);
      return `<div class="dh ${date===today()?'today':''}"><b>${s.dia}</b><small style="color:${ok?'var(--green)':'#a86a2d'}">${fmt(t.k)} / ${fmt(tg.kcal)} kcal</small>${pr.cheatDias.includes((i+1)%7)?'<div class="tiny" style="margin-top:2px">🍫</div>':''}</div>`}).join('')}
    ${rows.map(row=>`<div class="rh"><span>${mealIc(row)}</span>${row}</div>${plan.semana.map(s=>row==='Capricho'?(s.capricho?dish(s.capricho,'Capricho'):'<div class="dish empty">·</div>'):dish(s.comidas[row],row)).join('')}`).join('')}
  </div></div>
  <p class="tiny muted" style="margin-top:6px">Desliza para ver toda la semana · Toca un plato para ver la receta · Verde = día dentro de ±5% de tus calorías.</p>`}
  <p class="foot">Menú generado con IA a partir de tus preferencias. Revisa ingredientes si tienes alergias.</p>`;
  $('#mpre').onclick=()=>{MP.prefs=JSON.parse(JSON.stringify(pr));MP.step=0;MP.screen='wizard';vMenu();scrollTo(0,0)};
  $$('[data-rec]').forEach(b=>b.onclick=()=>openRecipe(R_(b.dataset.rec)));
  $$('.mpdays [data-day]').forEach(b=>b.onclick=()=>{MP.day=+b.dataset.day;vMenu()});
  $('#shop').onclick=()=>{modal(`<div class="top"><b>🛒 Lista de la compra</b><button class="close">✕</button></div>
    ${plan.lista_compra.length?plan.lista_compra.map(s=>`<p class="eyebrow" style="margin-top:16px">${esc(s.seccion)}</p>${(s.items||[]).map(i=>`<label class="wk" style="justify-content:flex-start;gap:10px;cursor:pointer"><input type="checkbox"> ${esc(i)}</label>`).join('')}`).join(''):'<p class="muted" style="margin-top:12px">No hay lista para este menú.</p>'}
    <button class="btn soft block" style="margin-top:16px" id="cpl">Copiar lista</button>`).querySelector('#cpl').onclick=async()=>{
      const t=plan.lista_compra.map(s=>s.seccion+'\n'+(s.items||[]).map(i=>'- '+i).join('\n')).join('\n\n');
      try{await navigator.clipboard.writeText(t);toast('Lista copiada ✓')}catch(e){toast('No se pudo copiar')}}};
  if($('#notas'))$('#notas').onclick=()=>modal(`<div class="top"><b>💡 Consejos de batch cooking</b><button class="close">✕</button></div><p style="margin-top:14px;line-height:1.6">${esc(plan.notas)}</p>`);
  $('#recs').onclick=()=>{const m=modal(`<div class="top"><b>📖 Recetas de la semana</b><button class="close">✕</button></div>
    <div style="margin-top:12px">${plan.recetas.map(r=>`<div class="rcard" data-r2="${r.id}"><div class="row"><span style="font-size:26px">${esc(r.emoji)}</span><div><b>${esc(r.nombre)}</b><small>${esc(r.tipo)} · ${r.kcal} kcal · P ${r.p} · C ${r.c} · G ${r.g}</small></div></div><span class="plus" style="display:grid;place-items:center">›</span></div>`).join('')}</div>`);
    m.querySelectorAll('[data-r2]').forEach(b=>b.onclick=()=>{m.remove();openRecipe(R_(b.dataset.r2))})};
}

function openRecipe(r){
  if(!r)return;
  const u=me(),k=me().mealprep.plan.recetas.indexOf(r)%5;
  const m=modal(`<div class="recipe"><div class="top"><b>${esc(r.tipo||'Receta')}${r.cheat?' · 🍫 capricho':''}</b><button class="close">✕</button></div>
    <div class="hero-ph ph${k}">${esc(r.emoji)}</div>
    <h3 class="h2" style="font-size:24px;margin-top:16px">${esc(r.nombre)}</h3>
    ${r.descripcion?`<p class="muted small" style="margin-top:6px">${esc(r.descripcion)}</p>`:''}
    <div class="plan" style="margin-top:14px"><div class="kc" style="font-size:32px">${r.kcal}<small> kcal / ración</small></div>
      <div class="mm"><div><b style="color:var(--p)">${r.p}g</b><small>Proteínas</small></div><div><b style="color:var(--c)">${r.c}g</b><small>Carbohidratos</small></div><div><b style="color:var(--g)">${r.g}g</b><small>Grasas</small></div></div></div>
    <div class="chips2"><span>⏱️ Prep. ${r.prep_min} min</span><span>🔥 Cocción ${r.coccion_min} min</span>${r.raciones_lote?`<span>🥡 Lote de ${r.raciones_lote} raciones</span>`:''}</div>
    <p class="eyebrow" style="margin-top:20px">Ingredientes · 1 ración</p>
    <ul class="ing">${r.ingredientes.map(i=>`<li>${esc(i.item)}<span>${esc(i.cantidad)}</span></li>`).join('')}</ul>
    <p class="eyebrow" style="margin-top:20px">Instrucciones</p>
    <ol>${r.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
    ${r.conservacion?`<div class="tip">🧊 <b>Conservación:</b> ${esc(r.conservacion)}</div>`:''}
    ${r.consejo?`<div class="tip" style="background:var(--lilac);color:var(--plum)">💡 ${esc(r.consejo)}</div>`:''}
    <p class="eyebrow" style="margin-top:20px">Añadir a mi diario de hoy</p>
    <div class="mealpick">${MEALS.map(([n,i])=>`<button data-am="${n}" class="${(r.tipo===n||(r.tipo==='Capricho'&&n==='Snack'))?'on':''}"><span>${i}</span>${n}</button>`).join('')}</div>
    <button class="btn block" style="margin-top:12px" id="addr">+ Añadir 1 ración al diario</button></div>`);
  let meal=MEAL_NAMES.includes(r.tipo)?r.tipo:'Snack';
  m.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>{meal=b.dataset.am;m.querySelectorAll('[data-am]').forEach(x=>x.classList.toggle('on',x===b))});
  m.querySelector('#addr').onclick=()=>{dayLog(u,today()).foods.push({fid:'mp_'+r.id,n:r.emoji+' '+r.nombre,k:r.kcal,p:r.p,c:r.c,g:r.g,meal});save();m.remove();toast('Añadido a '+meal+' de hoy ✓')};
}

function mpWizard(){
  const u=me(),pr=MP.prefs;
  const steps=['gustos','incluir','comidas','cheat','cocina'];const s=steps[MP.step],tot=steps.length;
  const tags=(arr,key,cls='')=>`<div class="tags">${arr.map(t=>`<button class="tag ${cls} ${pr[key].includes(t)?'on':''}" data-tg="${key}" data-val="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  let body='',ok=true;
  if(s==='gustos'){body=`<p class="eyebrow">Paso 1 de ${tot}</p><h2 class="h2" style="margin-top:8px">¿Qué te <span>gusta comer?</span></h2><p class="muted" style="margin-top:6px">Elige estilos y cuéntanos tus platos favoritos.</p>
    ${tags(GUSTOS,'gustos')}<label class="f"><span>Tus platos o sabores favoritos</span><textarea class="in" data-tx="gustosTxt" style="font-family:inherit;font-size:14px;min-height:70px" placeholder="Ej. me encantan el salmón al horno, el hummus y el arroz con pollo al curry">${esc(pr.gustosTxt)}</textarea></label>`}
  if(s==='incluir'){body=`<p class="eyebrow">Paso 2 de ${tot}</p><h2 class="h2" style="margin-top:8px">¿Qué incluir <span>siempre?</span></h2>
    ${tags(INCLUIR,'incluir')}<label class="f"><span>Otros alimentos que no pueden faltar</span><input class="in" data-tx="incluirTxt" value="${esc(pr.incluirTxt)}" placeholder="Ej. kéfir, pan de centeno"></label>
    <p class="h3" style="margin-top:24px">¿Algo que evitar?</p><p class="small muted">Alergias, intolerancias o cosas que no te gustan.</p>
    ${tags(EVITAR,'evitar','no')}<label class="f"><span>Otros</span><input class="in" data-tx="evitarTxt" value="${esc(pr.evitarTxt)}" placeholder="Ej. no me gusta el cilantro"></label>`}
  if(s==='comidas'){ok=pr.comidas.length>0;body=`<p class="eyebrow">Paso 3 de ${tot}</p><h2 class="h2" style="margin-top:8px">¿Qué comidas <span>diseñamos?</span></h2><p class="muted" style="margin-top:6px">Elige las comidas del día que quieres tener preparadas.</p>
    <div class="mealtog">${MEALS.map(([n,i])=>`<button class="${pr.comidas.includes(n)?'on':''}" data-ml="${n}"><span>${i}</span>${n}</button>`).join('')}</div>
    <p class="small muted" style="margin-top:12px">Las calorías de cada día se reparten entre las comidas que elijas.</p>`}
  if(s==='cheat'){const n=pr.cheatDias.length;body=`<p class="eyebrow">Paso 4 de ${tot}</p><h2 class="h2" style="margin-top:8px">¿Cuándo te das <span>un gusto?</span></h2>
    <p class="muted" style="margin-top:6px">Elige tus días de cheatmeal. Siempre dentro de tus calorías y macros.</p>
    <div class="chips">${[1,2,3,4,5,6,0].map(i=>`<button class="chip ${pr.cheatDias.includes(i)?'on':''}" data-cd="${i}">${DOW[i]}</button>`).join('')}</div>
    <div class="tip" style="${n>=5?'':'background:var(--beige);color:#7a5a2a'}">${n===0?'Sin cheat days: todo el menú será "limpio".':n>=5?'🍫 Has elegido '+n+' días: cada uno de esos días tendrá un pequeño capricho (p. ej. unas onzas de chocolate) que sigue cuadrando con tus macros.':'🍔 En '+(n===1?'ese día':'esos '+n+' días')+' una comida será tu cheatmeal favorito, y el resto del día se ajusta para que cuadre.'}</div>
    <p class="h3" style="margin-top:22px">¿Qué cheatmeal te encanta?</p>
    ${tags(CHEATS,'cheatFav')}<label class="f"><span>Otro</span><input class="in" data-tx="cheatTxt" value="${esc(pr.cheatTxt)}" placeholder="Ej. bocadillo de calamares"></label>`}
  if(s==='cocina'){body=`<p class="eyebrow">Paso 5 de ${tot}</p><h2 class="h2" style="margin-top:8px">¿Cómo <span>cocinas?</span></h2>
    <p class="h3" style="margin-top:18px">Sesiones de batch cooking por semana</p>
    <div class="optc three">${[1,2,3].map(n=>`<button class="tag ${pr.sesiones===n?'on':''}" data-ses="${n}">${n} ${n===1?'sesión':'sesiones'}</button>`).join('')}</div>
    <p class="h3" style="margin-top:18px">Tiempo en la cocina</p>
    <div class="optc">${[['rapido','⚡','Poco tiempo','Recetas muy rápidas y sencillas'],['normal','🍳','Normal','Equilibrio entre rapidez y sabor'],['mucho','👩‍🍳','Me encanta cocinar','Puede ser más elaborado']].map(([k,i,t,d])=>`<button class="opt ${pr.tiempo===k?'on':''}" data-tm="${k}" style="padding:12px"><span class="ic">${i}</span><div><b>${t}</b><small>${d}</small></div></button>`).join('')}</div>
    <div class="card" style="background:var(--tile);border:0"><p class="eyebrow">Tus objetivos para esta semana</p>
    <p class="small" style="margin-top:6px">${mpTargets(u).map(t=>t.dia.slice(0,3)+' '+fmt(t.kcal)).join(' · ')} kcal · P ${targetFor(u,today()).p} g · C ${targetFor(u,today()).c} g · G ${targetFor(u,today()).g} g</p></div>`}
  $('#view').innerHTML=`<div style="padding-top:26px"><div class="row between"><span class="eyebrow">Crear Mealprep</span><button class="btn ghost" id="mpx">Cancelar</button></div>
    <div class="pbar"><i style="width:${(MP.step+1)/tot*100}%"></i></div><div style="margin-top:20px">${body}</div>
    <div class="row" style="margin-top:26px">${MP.step>0?'<button class="btn soft" id="mpb">←</button>':''}<button class="btn block" id="mpn" ${ok?'':'disabled'}>${MP.step===tot-1?'✨ Generar mi menú':'Siguiente →'}</button></div></div>`;
  $$('[data-tg]').forEach(b=>b.onclick=()=>{const k=b.dataset.tg,v=b.dataset.val;pr[k]=pr[k].includes(v)?pr[k].filter(x=>x!==v):[...pr[k],v];mpWizard()});
  $$('[data-tx]').forEach(i=>i.oninput=()=>pr[i.dataset.tx]=i.value);
  $$('[data-ml]').forEach(b=>b.onclick=()=>{const v=b.dataset.ml;pr.comidas=pr.comidas.includes(v)?pr.comidas.filter(x=>x!==v):MEAL_NAMES.filter(x=>x===v||pr.comidas.includes(x));mpWizard()});
  $$('[data-cd]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cd;pr.cheatDias=pr.cheatDias.includes(i)?pr.cheatDias.filter(x=>x!==i):[...pr.cheatDias,i];mpWizard()});
  $$('[data-ses]').forEach(b=>b.onclick=()=>{pr.sesiones=+b.dataset.ses;mpWizard()});
  $$('[data-tm]').forEach(b=>b.onclick=()=>{pr.tiempo=b.dataset.tm;mpWizard()});
  $('#mpx').onclick=()=>{MP.screen='home';vMenu()};
  if($('#mpb'))$('#mpb').onclick=()=>{MP.step--;mpWizard();scrollTo(0,0)};
  $('#mpn').onclick=()=>{if(MP.step<tot-1){MP.step++;mpWizard();scrollTo(0,0)}else mpGenerate()};
}

let SAMPLE=undefined;
async function getSample(){
  if(SAMPLE!==undefined)return SAMPLE;
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  try{SAMPLE=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){SAMPLE=null}
  return SAMPLE;
}
async function mpGenerate(){
  const u=me(),pr=MP.prefs;
  MP.screen='gen';MP.err='';MP.progress='Pensando en tu semana…';mpGenView();
  const sample=await getSample();
  if(!sample){MP.err='La generación con IA no está disponible en esta versión. En la web publicada en vuestro dominio hay que conectar un servicio de IA desde vuestro servidor.';mpGenView();return}
  MP.ctl=new AbortController();
  try{
    const raw=await sample.json(mpPrompt(u,pr),{signal:MP.ctl.signal,modelTier:'default',cache:false,onText:({text})=>{
      const n=(text.match(/"nombre"\s*:/g)||[]).length;
      MP.progress=text.includes('"semana"')?(text.includes('"lista_compra"')?'Preparando la lista de la compra…':'Organizando tu semana de lunes a domingo…'):n?`Diseñando recetas… ${n} lista${n>1?'s':''}`:'Pensando en tu semana…';
      const p=$('#mpprog');if(p)p.textContent=MP.progress}});
    const plan=mpValidate(raw,pr);
    u.mealprep={prefs:JSON.parse(JSON.stringify(pr)),plan,creado:today()};save();
    MP.screen='home';if(UI.view==='menu')vMenu();toast('¡Tu menú está listo! 🎉');
  }catch(e){
    const c=e&&e.code;
    MP.err=c==='cancelled'?'':c==='not_granted'||c==='sampling_disabled'?'No se ha permitido usar la IA en esta página.':c==='rate_limited'?'Has hecho muchas peticiones seguidas. Espera un poco y vuelve a intentarlo.':c==='invalid_json'||(e&&e.message==='formato')?'La IA devolvió un menú incompleto. Vuelve a intentarlo.':'No se pudo generar el menú. Vuelve a intentarlo.';
    if(c==='cancelled'){MP.screen='wizard';if(UI.view==='menu')mpWizard();return}
    if(UI.view==='menu')mpGenView();
  }
}
function mpGenView(){
  $('#view').innerHTML=`<div class="card gen" style="margin-top:30px">${MP.err?`<div style="font-size:44px">😕</div><div class="h3" style="margin-top:10px">No hemos podido crear tu menú</div><p class="small muted" style="margin-top:6px">${esc(MP.err)}</p>
    <div class="grid2" style="margin-top:18px"><button class="btn soft" id="mpbk">← Ajustar preferencias</button><button class="btn" id="mprt">Reintentar</button></div>`
    :`<div class="spin">🥗</div><div class="h3" style="margin-top:14px;font-size:20px">Creando tu Mealprep…</div><p class="small muted" style="margin-top:6px" id="mpprog">${esc(MP.progress)}</p>
    <p class="tiny muted" style="margin-top:14px">Suele tardar entre 30 segundos y 2 minutos. Ajustamos cada día a tus calorías y macros.</p><button class="btn ghost" style="margin-top:18px" id="mpst">Detener</button>`}</div>`;
  if($('#mpst'))$('#mpst').onclick=()=>MP.ctl&&MP.ctl.abort();
  if($('#mpbk'))$('#mpbk').onclick=()=>{MP.screen='wizard';mpWizard()};
  if($('#mprt'))$('#mprt').onclick=mpGenerate;
}

/* ---------- Router ---------- */
function route(){
  $$('.modal').forEach(m=>m.remove());
  const u=me();
  if(!u)return renderAuth();
  if(!u.profile)return startOnboarding(false);
  renderApp();
  maybeWelcome();
}
let LAST_MOB=innerWidth<=640;
addEventListener('resize',()=>{const m=innerWidth<=640;if(m!==LAST_MOB){LAST_MOB=m;if(me()?.profile&&!SCREEN.busy&&$('#view'))renderApp()}});
route();
initCloud();
</script>
