<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tienda · Vuelve</title>
<meta name="description" content="Packs de recetas, rutinas y merch de Vuelve.">
<meta property="og:title" content="Tienda · Vuelve">
<meta property="og:description" content="Packs de recetas, rutinas y merch de Vuelve.">
<meta property="og:image" content="https://ninnx3.github.io/VUELVE/img/og-unete.jpg">
<meta name="theme-color" content="#744a69">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#744a69;--plum-d:#5e3a55;--ink:#3d383c;--muted:#5d4a59;--line:#e2d4de;--bg:#f5eff4;--lilac:#ebe1f3;--tile:#f1e8f1;--em:#2f6f5d;--mint:#e3efe9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--plum)}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px}
.bar img{height:30px;width:auto;display:block}
.bar .sp{flex:1}
.lang{display:inline-flex;background:var(--tile);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted)}
.lang button.on{background:var(--plum);color:#fff}
.app{font-size:13px;font-weight:700;text-decoration:none;padding:8px 12px;border-radius:10px;background:var(--lilac)}
main{max-width:1100px;margin:0 auto;padding:26px 20px 60px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--plum)}
h1{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-.6px;margin:6px 0 8px}
h1 span{color:#a7769a;font-weight:500}
.sub{color:var(--muted);max-width:560px}
.note{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px 16px;margin:20px 0 4px;font-size:14px}
.note.soon{background:var(--lilac);border:1.5px solid #dccbe6}
.note.test{background:#fff6e0;border:1.5px solid #f0dca8;color:#6a5320}
.note .e{font-size:24px}
.note a{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:24px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(116,74,105,.12)}
.cover{aspect-ratio:4/3;background:linear-gradient(135deg,#efe3f3,#f7e8ee);display:grid;place-items:center;font-size:56px;background-size:cover;background-position:center}
.card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .t{font-weight:800;font-size:16px;line-height:1.25}
.card .d{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .f{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:18px;color:var(--plum)}
.kind{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--mint);color:var(--em)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e{font-size:44px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:var(--plum);color:#fff;font-weight:800;font-size:16px;padding:15px 20px;text-decoration:none}
.btn:hover{background:var(--plum-d)}.btn[disabled]{opacity:.6;cursor:default}
.btn.soft{background:var(--lilac);color:var(--plum)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(40,20,35,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .p{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0}
.sheet .cover{aspect-ratio:16/9;font-size:72px}
.sheet .c{padding:20px 22px 26px}
.sheet h2{font-size:24px;font-weight:800;line-height:1.15;margin:4px 0 10px}
.sheet .desc{color:var(--muted);white-space:pre-line}
.sheet ul{list-style:none;margin:16px 0 0;display:grid;gap:8px}
.sheet li{display:flex;gap:10px;font-size:14px}
.sheet li::before{content:'✓';color:var(--em);font-weight:800}
.buy{display:flex;align-items:center;gap:14px;margin-top:20px;position:sticky;bottom:0;background:#fff;padding:12px 0 4px}
.buy .btn{flex:1}
.x{position:absolute;margin:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);font-size:18px;font-weight:700;color:var(--plum)}
.err{color:#a3324a;font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
.small{font-size:12px;color:var(--muted)}
@media(min-width:700px){.sheet{align-items:center}.sheet .p{border-radius:24px}h1{font-size:48px}}
</style>
</head>
<body>
<div class="bar"><div class="in"><a href="../"><img src="../img/logo/vuelve-logo-ciruela.svg" alt="Vuelve"></a><span class="sp"></span><a class="app" href="../" data-t="app"></a><div class="lang"><button data-l="es">ES</button><button data-l="en">EN</button></div></div></div>
<main>
  <div class="eyebrow" data-t="eyebrow"></div>
  <h1 data-t="h1"></h1>
  <p class="sub" data-t="sub"></p>
  <div id="note"></div>
  <div id="list" class="grid"></div>
</main>
<script>
const ICO={"producto-pack":"M182 434C182 425 182 417 182 416C182 415 179 415 170 415C132 415 114 406 107 381C106 376 106 365 105 292C104 245 104 197 103 184C101 146 102 126 104 115C110 87 129 70 161 65C186 60 255 61 340 67C347 67 359 68 366 69C387 70 395 73 401 82C406 90 406 93 407 146C408 193 409 220 411 283C413 327 412 332 405 337C397 342 393 349 391 362C389 375 393 389 402 398C407 403 407 408 403 410C398 412 374 413 316 413C288 413 261 414 256 414L248 414L247 432C247 442 247 450 246 450C245 450 235 442 221 431L215 426L205 434C199 438 194 442 194 442C193 443 183 450 183 450C182 450 182 443 182 434ZM237 370C237 370 227 370 214 370L192 370L192 400C192 416 192 430 193 430C193 430 195 428 199 426C202 423 207 420 210 418L215 414L226 423L236 431L237 401C237 384 238 370 237 370ZM384 398C385 398 384 396 383 394C375 381 375 359 383 345C384 343 385 341 385 340C384 340 183 340 173 341C156 342 150 345 142 352C135 360 130 372 132 382C133 387 135 390 142 394C146 396 147 396 164 397L181 397L181 392C182 390 182 383 182 379L182 370L177 369C166 368 164 366 170 364C183 358 235 358 330 362C354 363 357 363 356 364C355 365 322 367 285 368C264 369 247 370 247 370C247 370 247 377 247 384L248 398L251 398C255 399 384 399 384 398ZM135 338C142 331 150 327 160 326L168 326L168 312C169 304 169 262 168 206C167 156 167 108 167 99C167 91 167 84 166 84C164 84 152 89 149 91C144 94 139 99 137 104C130 118 130 123 130 224C129 273 129 320 128 329C128 337 128 344 128 344C128 344 131 341 135 338ZM391 327C395 325 396 322 395 281C395 260 394 224 394 202C394 179 395 145 395 127C396 82 397 83 371 82C362 81 345 80 333 80C293 77 262 76 237 76C213 77 182 80 180 82C179 83 178 292 179 311L180 326L246 326C304 326 375 327 376 329C377 329 388 328 391 327ZM227 297C225 295 226 293 231 282L235 272L232 262C224 238 224 222 232 203C241 179 261 164 298 153C342 138 350 135 363 124C366 122 368 120 369 120C369 120 368 123 367 126C364 137 360 157 359 170C357 210 346 236 326 253C311 266 298 270 268 274C244 277 244 277 238 289C233 298 230 300 227 297ZM250 269C251 268 259 264 274 259C305 249 323 236 333 214C338 204 341 196 345 177C347 167 349 156 351 151C353 146 354 142 354 142C353 142 351 144 348 146C341 151 330 156 318 161C285 173 275 178 263 188C247 203 238 229 238 259L238 266L243 256C259 227 279 206 305 191C312 187 314 187 308 192C298 199 282 216 272 231C267 238 248 269 248 270C248 270 250 270 250 269Z","producto-merch":"M214 416C182 414 153 408 141 402C137 401 137 400 141 382C145 363 149 330 151 300C152 286 154 245 153 244C153 244 152 247 149 250C142 262 139 266 136 266C131 266 112 255 93 240C79 229 67 220 64 218L62 216L66 206C87 146 113 116 155 102C166 99 185 95 197 93L204 92L209 99C220 114 236 122 257 124C281 125 307 113 316 96C318 91 318 91 332 93C363 98 384 108 404 127C420 142 435 167 444 196L449 211L446 214C444 215 438 220 433 225C406 249 385 264 378 264C374 264 374 263 369 256C366 251 363 247 362 246C361 241 360 245 361 259C363 314 367 358 374 391C376 397 376 398 374 399C367 405 350 410 328 413C300 417 246 418 214 416ZM347 400C365 398 372 397 372 396C372 396 370 394 368 391C360 380 352 361 349 343C345 318 344 295 348 253C350 227 349 221 345 207C344 202 349 208 368 232L379 246L388 239C404 226 423 216 437 212C442 211 445 210 445 210C445 210 444 209 442 208C439 205 431 195 422 182C395 139 380 124 347 106C343 103 324 95 323 95C323 95 322 100 322 106C322 116 322 118 320 124C302 166 249 178 217 147C204 134 197 114 200 100C200 98 201 95 200 95C199 93 163 110 151 119C126 135 101 162 70 208L64 216L70 216C85 218 107 228 127 242C131 245 134 247 135 247C135 247 138 244 141 240C146 232 165 209 167 207C169 205 169 206 167 212C165 218 165 242 167 264C169 294 168 326 164 345C160 365 151 386 143 395C140 399 141 399 145 398C150 396 178 394 191 394C202 394 217 395 252 398C301 401 320 402 347 400ZM279 150C292 145 303 135 309 124C310 120 312 117 311 117C311 117 309 118 307 120C283 139 240 140 216 121C210 116 210 116 214 124C221 139 235 149 252 152C258 153 274 152 279 150Z"};const ico=(n,s=56)=>`<svg viewBox="40 40 432 432" width="${s}" height="${s}" style="color:#744a69" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="${ICO[n]}"/></svg>`;
const SB_URL='https://vzzkzajzzehhxzwonpgv.supabase.co',SB_KEY='sb_publishable_9-Tb4XFSfV_EXN6cG1Nxtw_KZotYkWS';
const T={
 es:{eyebrow:'Tienda',h1:'Lo que nos <span>funciona,</span> para ti.',sub:'Packs de recetas, rutinas y merch de Vuelve. Las descargas llegan al momento.',app:'Abrir la app',
  soon:'La tienda abre muy pronto. <a href="../unete/">Apúntate</a> y te avisamos el primer día.',soonAdmin:'La tienda está cerrada al público. Como administradora puedes probar la compra.',
  test:'Modo de prueba: no se cobra nada. Paga con la tarjeta <b>4242 4242 4242 4242</b>, cualquier fecha futura y cualquier CVC.',
  noStripe:'Stripe aún no está conectado: los botones de compra se activarán cuando lo esté.',
  empty:'Todavía no hay productos. ¡Vuelve pronto!',dl:'Descarga',ph:'Producto físico',incl:'Incluye',
  buy:'Comprar',soonBtn:'Muy pronto',wait:'Abriendo el pago…',err:'No se ha podido iniciar el pago. Inténtalo de nuevo.',files:n=>n===1?'1 archivo':n+' archivos',
  secure:'Pago seguro con Stripe. Recibirás el recibo por email.'},
 en:{eyebrow:'Shop',h1:'What <span>works for us,</span> for you.',sub:'Vuelve recipe bundles, workout routines and merch. Downloads arrive instantly.',app:'Open the app',
  soon:'The shop opens very soon. <a href="../unete/">Join the list</a> and we\'ll tell you on day one.',soonAdmin:'The shop is closed to the public. As an admin you can test buying.',
  test:'Test mode: nothing is charged. Pay with card <b>4242 4242 4242 4242</b>, any future date and any CVC.',
  noStripe:'Stripe isn\'t connected yet: buy buttons will turn on once it is.',
  empty:'No products yet. Come back soon!',dl:'Download',ph:'Physical product',incl:'Includes',
  buy:'Buy',soonBtn:'Coming soon',wait:'Opening checkout…',err:'Couldn\'t start checkout. Please try again.',files:n=>n===1?'1 file':n+' files',
  secure:'Secure payment with Stripe. You\'ll get the receipt by email.'}};
let L=(()=>{const q=new URLSearchParams(location.search).get('l');if(q==='es'||q==='en')return q;try{const s=localStorage.getItem('vuelve_lang');if(s==='es'||s==='en')return s}catch(e){}return /^es\b/i.test(navigator.language||'es')?'es':'en'})();
let P=[],EST={abierta:false,stripe:false,modo:'test'},ADMIN=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=c=>new Intl.NumberFormat(L==='en'?'en-IE':'es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:c%100?2:0}).format(c/100);
const nm=p=>(L==='en'&&p.nombre_en)||p.nombre, ds=p=>(L==='en'&&p.descripcion_en)||p.descripcion, inc=p=>(L==='en'&&p.incluye_en&&p.incluye_en.length?p.incluye_en:p.incluye)||[];
function token(){try{const j=JSON.parse(localStorage.getItem('vuelve_auth')||sessionStorage.getItem('vuelve_auth')||'null');const s=j&&(j.access_token?j:j.currentSession);if(s&&s.access_token&&(!s.expires_at||s.expires_at*1000>Date.now()))return s.access_token}catch(e){}return null}
async function fn(body){const tk=token();const r=await fetch(SB_URL+'/functions/v1/tienda',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,...(tk?{Authorization:'Bearer '+tk}:{})},body:JSON.stringify(body)});return {status:r.status,data:await r.json().catch(()=>({}))}}
const canBuy=()=>EST.stripe&&(EST.abierta||ADMIN);
const cover=(p,big)=>`<div class="cover" style="${p.portada?`background-image:url('${esc(p.portada)}')`:''}">${p.portada?'':(p.tipo==='fisico'?ico('producto-merch',big?84:64):ico('producto-pack',big?84:64))}</div>`;
function render(){
  const D=T[L];document.documentElement.lang=L;document.title=(L==='en'?'Shop':'Tienda')+' · Vuelve';
  document.querySelectorAll('[data-t]').forEach(n=>n.innerHTML=D[n.dataset.t]);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
  let note='';
  if(!EST.abierta)note+=`<div class="note soon"><span class="e">🌱</span><div>${ADMIN?D.soonAdmin:D.soon}</div></div>`;
  if(EST.abierta||ADMIN){if(!EST.stripe)note+=`<div class="note test"><span class="e">🔌</span><div>${D.noStripe}</div></div>`;else if(EST.modo==='test')note+=`<div class="note test"><span class="e">🧪</span><div>${D.test}</div></div>`}
  document.getElementById('note').innerHTML=note;
  document.getElementById('list').innerHTML=P.length?P.map(p=>`<button class="card" data-p="${esc(p.slug)}">${cover(p)}<div class="b"><div class="t">${esc(nm(p))}</div><div class="d">${esc(ds(p))}</div><div class="f"><span class="price">${eur(p.precio_cent)}</span><span class="kind" ${p.oculto?'style="background:#fff6e0;color:#6a5320"':''}>${p.oculto?(L==='en'?'Hidden · admins':'Oculto · admin'):(p.tipo==='fisico'?D.ph:D.dl)}</span></div></div></button>`).join(''):`<div class="empty" style="grid-column:1/-1"><div class="e">🛍️</div>${D.empty}</div>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>open(b.dataset.p));
}
function open(slug){
  const p=P.find(x=>x.slug===slug);if(!p)return;const D=T[L];
  const u=new URL(location);u.searchParams.set('p',slug);history.replaceState(null,'',u);
  const s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div class="p" role="dialog" aria-modal="true"><button class="x" aria-label="Cerrar">✕</button>${cover(p,1)}<div class="c"><span class="kind">${p.tipo==='fisico'?D.ph:D.dl+(p.n_archivos?' · '+D.files(p.n_archivos):'')}</span><h2>${esc(nm(p))}</h2><p class="desc">${esc(ds(p))}</p>${inc(p).length?`<ul>${inc(p).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
  <div class="buy"><span class="price" style="font-size:24px">${eur(p.precio_cent)}</span><button class="btn" id="buy" ${canBuy()?'':'disabled'}>${canBuy()?D.buy:D.soonBtn}</button></div><div class="err" id="berr"></div><p class="small">${D.secure}</p></div></div>`;
  const close=()=>{s.remove();const u=new URL(location);u.searchParams.delete('p');history.replaceState(null,'',u)};
  s.onclick=e=>{if(e.target===s)close()};s.querySelector('.x').onclick=close;document.body.appendChild(s);
  const b=s.querySelector('#buy');b.onclick=async()=>{if(!canBuy())return;b.disabled=true;b.textContent=D.wait;s.querySelector('#berr').textContent='';
    try{const r=await fn({accion:'checkout',producto_id:p.id,idioma:L});if(!r.data.url)throw 0;location.href=r.data.url}
    catch(e){s.querySelector('#berr').textContent=D.err;b.disabled=false;b.textContent=D.buy}};
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('vuelve_lang',L)}catch(e){}render()});
(async()=>{
  render();
  const h={apikey:SB_KEY,...(token()?{Authorization:'Bearer '+token()}:{})};
  const [pr,es]=await Promise.all([
    fetch(SB_URL+'/rest/v1/productos_publicos?select=*&order=orden.asc,nombre.asc',{headers:{apikey:SB_KEY}}).then(r=>r.ok?r.json():[]).catch(()=>[]),
    fn({accion:'estado'}).then(r=>r.data).catch(()=>null)]);
  P=Array.isArray(pr)?pr:[];if(es&&!es.error)EST=es;
  if(token()){try{const r=await fetch(SB_URL+'/rest/v1/admins?select=user_id',{headers:h});const j=await r.json();ADMIN=Array.isArray(j)&&j.length>0}catch(e){}}
  if(ADMIN){try{const r=await fetch(SB_URL+'/rest/v1/productos?select=*&order=orden.asc,nombre.asc',{headers:h});const all=await r.json();
    if(Array.isArray(all))P=all.map(p=>({...p,n_archivos:(p.archivos||[]).length,oculto:!p.activo}))}catch(e){}}
  render();const q=new URLSearchParams(location.search).get('p');if(q)open(q);
})();
</script>
